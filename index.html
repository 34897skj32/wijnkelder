<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kelder">
<meta name="theme-color" content="#2a1418">
<title>Wijnkelder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#24181a; --muted:#7d6f6a; --line:#e6ddd2;
  --wine:#7b1e2f; --wine-soft:#f3e3e3; --liz:#2f6f6a; --liz-soft:#e0eeec;
  --viv:#8a7a5c; --viv-soft:#efe9dc; --pred:#a8742a;
  --ok:#3d7a3a; --warn:#b5702a; --bad:#a3352f;
  --shadow:0 1px 2px rgba(40,20,20,.06),0 4px 14px rgba(40,20,20,.06);
  --r:16px; --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171113; --card:#221a1c; --ink:#f1e8e4; --muted:#a8999a; --line:#3a2e30;
  --wine:#e0707f; --wine-soft:#3d2228; --liz:#6cc0b7; --liz-soft:#1e3533;
  --viv:#c9b98f; --viv-soft:#332d22; --pred:#e0a85a; --shadow:none;}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:26px}
.who{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.who button{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--muted)}
.who button.on{background:var(--ink);color:var(--bg)}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.search{margin-top:10px;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted)}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
main{padding:4px 16px 20px;max-width:760px;margin:0 auto}
.group{margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between}
.group h2{font-size:18px}
.group span{color:var(--muted);font-size:13px}
.list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:700px){.list{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.card{display:flex;gap:12px;min-width:0;overflow:hidden;background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);border:1px solid var(--line);text-align:left;width:100%}
.lbl{width:62px;height:84px;flex:none;border-radius:10px;background:var(--wine-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:var(--wine);overflow:hidden;position:relative}
.lbl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--card)}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cname{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cmeta{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.scores{display:flex;gap:5px;flex-wrap:wrap}
.sc{min-width:42px;padding:3px 6px 2px;border-radius:9px;text-align:center;line-height:1.1}
.sc b{display:block;font-size:15px;font-weight:600}
.sc i{font-style:normal;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.sc.j{background:var(--wine-soft);color:var(--wine)}
.sc.l{background:var(--liz-soft);color:var(--liz)}
.sc.v{background:var(--viv-soft);color:var(--viv)}
.sc.p{border:1.5px dashed var(--pred);color:var(--pred)}
.sc.empty{opacity:.35}
.cnt{font-weight:600;font-size:13px;white-space:nowrap}
.vts{display:flex;gap:4px;flex-wrap:wrap}.vt{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}.vt b{color:var(--wine);font-weight:600}
.iss{font-size:11.5px;color:var(--bad);font-weight:500}
.vrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}.vrow:first-of-type{border-top:0}.vrow.cur{font-weight:600;color:var(--wine)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--viv-soft);color:var(--viv);font-weight:500}
.tag.best{background:#e3f0df;color:var(--ok)}.tag.nu{background:#f8e6d3;color:var(--warn)}.tag.over{background:#f6dcda;color:var(--bad)}
.empty-state{text-align:center;color:var(--muted);padding:40px 16px}
.empty-state h3{color:var(--ink);font-size:20px;margin-bottom:6px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 10px;min-width:60px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--wine)}
nav .plus{width:52px;height:52px;border-radius:50%;background:var(--wine);color:#fff;margin-top:-26px;box-shadow:0 6px 18px rgba(123,30,47,.35);justify-content:center;padding:0;min-width:0}
nav .plus svg{width:26px;height:26px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;overflow-x:hidden;position:relative;border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.x{position:sticky;top:0;float:right;margin:-2px -4px 0 8px;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1;color:var(--muted);z-index:2}
.hero h2,.cname,.sheet h2{overflow-wrap:anywhere}
@keyframes up{from{transform:translateY(30px);opacity:.5}}@keyframes fade{from{opacity:0}}
.hero{display:flex;gap:14px;align-items:flex-start}
.hero .lbl{width:92px;height:126px}
.hero h2{font-size:22px;line-height:1.15}
.big-scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.bs{border-radius:14px;padding:10px 6px 8px;text-align:center}
.bs b{font-family:var(--serif);font-size:26px;display:block;line-height:1}
.bs i{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.bs.j{background:var(--wine-soft);color:var(--wine)}.bs.l{background:var(--liz-soft);color:var(--liz)}.bs.v{background:var(--viv-soft);color:var(--viv)}.bs.p{border:1.5px dashed var(--pred);color:var(--pred)}
.bs.empty b{opacity:.3}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.sec h3{font-size:15px;margin-bottom:8px}
.note{border-left:3px solid var(--wine);padding:2px 0 2px 10px;margin:10px 0}
.note.Liz{border-color:var(--liz)}
.note small{color:var(--muted);font-size:12px;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.timeline{position:relative;height:34px;margin:8px 0 2px}
.tl-bar{position:absolute;top:12px;height:8px;border-radius:8px;background:var(--viv-soft)}
.tl-best{position:absolute;top:12px;height:8px;border-radius:8px;background:var(--ok)}
.tl-now{position:absolute;top:4px;width:2px;height:24px;background:var(--ink)}
.tl-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar div{height:6px;border-radius:6px;background:var(--line);overflow:hidden}.bar div span{display:block;height:100%;background:var(--wine)}
.loc{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.loc:first-of-type{border-top:0}
.btn{padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--wine);color:#fff;text-align:center}
.btn.sec2{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%;margin-top:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
textarea.inp{min-height:70px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:56px;white-space:nowrap;padding:10px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button.rec{border-color:var(--ok)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px}
.stepper b{font-family:var(--serif);font-size:28px;min-width:30px;text-align:center}
.rate{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.rate.Jeroen{border-top:4px solid var(--wine)}.rate.Liz{border-top:4px solid var(--liz)}
.rate-h{display:flex;justify-content:space-between;align-items:center}
.rate-n{font-family:var(--serif);font-size:40px;line-height:1}
.rate.Jeroen .rate-n{color:var(--wine)}.rate.Liz .rate-n{color:var(--liz)}
input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--wine)}
.rate.Liz input[type=range]{accent-color:var(--liz)}
.res{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.res .lbl{width:36px;height:48px;font-size:14px;border-radius:7px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90vw;animation:fade .2s}
.toast.err{background:var(--bad);color:#fff}
.login{max-width:360px;margin:12vh auto 0;padding:0 16px}
.login h1{font-size:38px;margin-bottom:4px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{font-family:var(--serif);font-size:24px;display:block}
.stat i{font-style:normal;font-size:12px;color:var(--muted)}
.srow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-of-type{border-top:0}
.srow span:last-child{font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
.mut{font-size:13px;display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://tjkdywtyssdhssnldmkn.supabase.co';
const SB_KEY='sb_publishable_DO9L0-U5NC_YEjxiHZbVwg_-9BLF2Iz';
const sb=supabase.createClient(SB_URL,SB_KEY);
const ZONES=['8°C','10°C','16°C','18°C'];
const ZNAAM={'8°C':'8°C klimaatkast','10°C':'10°C klimaatkast','16°C':'16°C klimaatkast','18°C':'18°C kelder'};
const KLEUREN=['Rood','Wit','Rosé','Mousserend','Dessertwijn'];
const COLS='wijn_id,producent,wijnnaam_cuvee,jaargang,wijnkleur,land,regio,regionale_stijl,druiven,etiketfoto_url,flesfoto_url,vivino_gemiddelde,likely_to_like_jeroen,likely_to_like_liz,match_betrouwbaarheid_jeroen,match_betrouwbaarheid_liz,voorraad,locaties,rating_jeroen,rating_liz,aantal_ratings_jeroen,aantal_ratings_liz,drinkstatus,bewaarzone_advies,validatiestatus,zone_advies,smaakmatch,prijscategorie,drinkvenster_vanaf_jaar,drinkvenster_tot_jaar,beste_drinkmoment_vanaf,beste_drinkmoment_tot,prijs,prijs_indicatie_eur,laatste_prijs,advies_bron,stijlfamilie';
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const S={ik:ls.get('ik','Jeroen'),tab:ls.get('tab','kelder'),groep:ls.get('groep','zone'),kleur:'',q:'',kelder:null,vakken:[],geproefd:null,ontdek:[],smaak:null,sort:'rating'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>n==null?'–':Number(n).toFixed(1);
const LANDNL={France:'Frankrijk',Spain:'Spanje',Italy:'Italië',Germany:'Duitsland',Austria:'Oostenrijk',Portugal:'Portugal','South Africa':'Zuid-Afrika',Argentina:'Argentinië',Chile:'Chili','United States':'Verenigde Staten',Netherlands:'Nederland',Hungary:'Hongarije',Australia:'Australië','New Zealand':'Nieuw-Zeeland',Greece:'Griekenland',Slovenia:'Slovenië',Switzerland:'Zwitserland',Lebanon:'Libanon',Uruguay:'Uruguay',Croatia:'Kroatië',Georgia:'Georgië',Israel:'Israël',Romania:'Roemenië',Bulgaria:'Bulgarije',England:'Engeland',Canada:'Canada',Moldova:'Moldavië',Brazil:'Brazilië',Mexico:'Mexico',Belgium:'België',Luxembourg:'Luxemburg',Turkey:'Turkije',Morocco:'Marokko',Cyprus:'Cyprus',Slovakia:'Slowakije','Czech Republic':'Tsjechië',Denmark:'Denemarken',fr:'Frankrijk'};
const landNL=l=>LANDNL[l]||l;
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const NLLAND=Object.fromEntries(Object.entries(LANDNL).map(([e,n])=>[norm(n),e]));
const ilk=x=>x.replace(/[aeiouyàáâäãåèéêëìíîïòóôöõùúûüýç]/gi,'_');
const naam=w=>[w.producent,w.wijnnaam_cuvee].filter(Boolean).join(' · ');
const meta=w=>[w.jaargang,w.regio||landNL(w.land),w.wijnkleur].filter(Boolean).join(' · ');
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?5000:2200)}
async function q(p){const {data,error}=await p;if(error){console.error(error);toast(error.message.replace(/^.*?: /,''),1);throw error}return data}
const NLERR={'Onvoldoende':'Er ligt hier geen fles meer'};

function imgs(w){const a=[];if(w.flesfoto_url)a.push(w.flesfoto_url);const e=w.etiketfoto_url;
  if(e){const m=e.match(/images\.vivino\.com\/labels\/([^./]+)\./);if(m)a.push(`https://images.vivino.com/thumbs/${m[1]}_pb_x300.png`);a.push(e.replace(/^\/\//,'https://'))}return a}
function nextImg(el){const l=(el.dataset.alt||'').split('|').filter(Boolean);if(!l.length)return el.remove();el.dataset.alt=l.slice(1).join('|');el.src=l[0]}
function lbl(w,cls='lbl'){const a=imgs(w);const ini=esc((w.wijnkleur||'?')[0]);
  return `<div class="${cls}">${ini}${a.length?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(a[0])}" data-alt="${esc(a.slice(1).join('|'))}" alt="" onerror="nextImg(this)">`:''}</div>`}
function sc(cls,v,lab){return `<div class="sc ${cls}${v==null?' empty':''}"><b>${f1(v)}</b><i>${lab}</i></div>`}
function scores(w){
  const mine=S.ik==='Liz'?w.rating_liz:w.rating_jeroen, pred=S.ik==='Liz'?w.likely_to_like_liz:w.likely_to_like_jeroen;
  return `<div class="scores">${sc('j',w.rating_jeroen,'Jeroen')}${sc('l',w.rating_liz,'Liz')}${sc('v',w.vivino_gemiddelde,'Vivino')}${mine==null&&pred!=null?sc('p',pred,'Verwacht '+(S.ik==='Liz'?'L':'J')):''}</div>`}
function stag(s){if(!s)return'';const c={'Nu perfect':'best','Bijna op dronk':'','Nog net te drinken':'nu','Over de top':'over'}[s]||'';return `<span class="tag ${c}">${esc(s)}</span>`}
const wkey=w=>((w.producent||'')+'|'+(w.wijnnaam_cuvee||'')).toLowerCase().replace(/\s+/g,' ').trim();
const metaNV=w=>[w.regio||landNL(w.land),w.wijnkleur].filter(Boolean).join(' · ');
function cluster(items){const m=new Map();items.forEach(i=>{const k=wkey(i.w);if(!m.has(k))m.set(k,[]);m.get(k).push(i)});return [...m.values()].map(c=>c.sort((a,b)=>(b.w.jaargang||0)-(a.w.jaargang||0)))}
function gcard(cl,mode){if(cl.length===1)return null;
  const p=(cl.find(i=>i.w.rating_jeroen!=null||i.w.rating_liz!=null)||cl[0]).w, tot=cl.reduce((a,i)=>a+(i.n||0),0);
  const chips=cl.map(i=>`<span class="vt">${i.w.jaargang||'NV'}${mode==='rating'?(i.w.rating_jeroen!=null?` · <b>${f1(i.w.rating_jeroen)}</b>`:''):` · ${i.n}×`}</span>`).join('');
  return `<button class="card" onclick="detail('${p.wijn_id}')">${lbl(p)}<div class="cbody">
  <div class="cname">${esc(naam(p))}</div><div class="cmeta">${esc(metaNV(p))} · ${cl.length} jaargangen${tot&&mode!=='rating'?` · <b>${tot} fl.</b>`:''}</div>
  <div class="vts">${chips}</div><div class="crow">${scores(p)}</div></div></button>`}
function issues(w){const r=[];if(w.validatiestatus==='Gecontroleerd')return r;
  if(!w.jaargang&&w.wijnkleur!=='Mousserend')r.push('geen jaargang');
  if(!w.producent)r.push('geen producent');
  if(/te controleren/i.test(w.validatiestatus||''))r.push('naam/producent onzeker');
  if(/[?…]/.test(naam(w)))r.push('naam onvolledig');
  return r}
function card(w,extra){return `<button class="card" onclick="detail('${w.wijn_id}')">${lbl(w)}<div class="cbody">
  <div class="cname">${esc(naam(w))}</div><div class="cmeta">${esc(meta(w))}</div>
  ${extra?`<div class="cmeta">${extra}</div>`:''}
  <div class="crow">${scores(w)}</div></div></button>`}

/* ---------- auth ---------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return loginView();
  render();
}
function loginView(){
  $('#app').innerHTML=`<div class="login"><h1>Wijnkelder</h1><p class="muted">Log in met je account.</p>
  <label class="f">E-mail</label><input class="inp" id="em" type="email" autocomplete="username">
  <label class="f">Wachtwoord</label><input class="inp" id="pw" type="password" autocomplete="current-password">
  <button class="btn full" id="lb">Inloggen</button></div>`;
  $('#lb').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error) return toast('Inloggen mislukt: '+error.message,1); render();};
}

/* ---------- shell ---------- */
const ICON={
 kelder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l9-6 9 6v10H3z"/><path d="M8 20v-6h8v6M8 17h8"/></svg>',
 geproefd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h10l-1 7a4 4 0 01-8 0z"/><path d="M12 14v6M8 21h8"/></svg>',
 ontdek:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>',
 smaak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>'};
function render(){
  const t=S.tab;
  $('#app').innerHTML=`<header><div class="top"><h1>${{kelder:'Mijn kelder',geproefd:'Geproefd',ontdek:'Ontdekken',smaak:'Onze smaak'}[t]}</h1>
   <div class="who">${['Jeroen','Liz'].map(p=>`<button class="${S.ik===p?'on':''}" onclick="setIk('${p}')">${p}</button>`).join('')}</div></div>
   <div id="hsub"></div></header><main id="main"><div class="empty-state">Laden…</div></main>
  <nav>${navb('kelder','Kelder')}${navb('geproefd','Geproefd')}<button class="plus" onclick="addFlow()" aria-label="Toevoegen">${ICON.plus}</button>${navb('ontdek','Ontdekken')}${navb('smaak','Smaak')}</nav>`;
  ({kelder:kelderView,geproefd:geproefdView,ontdek:ontdekView,smaak:smaakView})[t]();
}
function navb(k,l){return `<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${ICON[k]}${l}</button>`}
function go(t){S.tab=t;ls.set('tab',t);S.q='';S.kleur='';render();scrollTo(0,0)}
function setIk(p){S.ik=p;ls.set('ik',p);render()}
function filterbar(placeholder,groups){
  return `<input class="search" placeholder="${placeholder}" value="${esc(S.q)}" oninput="S.q=this.value;refresh()">
  <div class="chips">${['',...KLEUREN].map(k=>`<button class="chip ${S.kleur===k?'on':''}" onclick="S.kleur='${k}';render()">${k||'Alles'}</button>`).join('')}</div>
  ${groups||''}`}
let rt;function refresh(){clearTimeout(rt);rt=setTimeout(()=>({kelder:drawKelder,geproefd:()=>S.sort==='gedronken'?gedronkenView():drawGeproefd(),ontdek:ontdekSearch})[S.tab]?.(),180)}
const match=w=>{if(S.kleur&&w.wijnkleur!==S.kleur)return false;if(!S.q)return true;const t=norm([naam(w),w.jaargang,w.regio,w.land,landNL(w.land),w.wijnkleur,w.druiven,w.regionale_stijl,w.stijlfamilie].join(' '));return norm(S.q).split(/\s+/).filter(Boolean).every(x=>t.includes(x))};

/* ---------- kelder ---------- */
async function kelderView(){
  const G={zone:'Zone',status:'Drinkmoment',smaak:'Smaakmatch',prijs:'Prijs',kleur:'Kleur',land:'Land',stijl:'Stijl'};
  $('#hsub').innerHTML=filterbar('Zoek in kelder…',`<div class="chips">${Object.entries(G).map(([k,l])=>`<button class="chip ${S.groep===k?'on':''}" onclick="S.groep='${k}';ls.set('groep','${k}');drawKelder();this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===this))">${l}</button>`).join('')}</div>`);
  if(!S.kelder){
    const [w,v,z]=await Promise.all([q(sb.from('wijn_overzicht').select(COLS).gt('voorraad',0)),q(sb.from('voorraad_per_vak').select('*')),q(sb.from('bewaarzones').select('zone,capaciteit'))]);
    S.kelder=w;S.vakken=v;S.cap=Object.fromEntries(z.map(x=>[x.zone,x.capaciteit]));
  }
  drawKelder();
}
const PRIO={'Over de top':0,'Nog net te drinken':1,'Nu perfect':2,'Drinkbaar':3,'Bijna op dronk':4,'Laten liggen':5};
const SM=c=>{const me=S.ik,o=me==='Liz'?'Jeroen':'Liz';return({J:me==='Jeroen'?'Voor mij':'Voor Jeroen',JL:'Voor mij & '+o,L:me==='Liz'?'Voor mij':'Voor Liz',G:'Voor gasten'})[c]||'Nog onbekend'};
const FASE={'Over de top':'Voorbij het drinkvenster — zo snel mogelijk opdrinken','Nog net te drinken':'Piek is voorbij, nog binnen het venster — binnenkort drinken','Nu perfect':'In de optimale periode — nu drinken','Drinkbaar':'Binnen het drinkvenster; topperiode nog onbekend','Bijna op dronk':'Al drinkbaar of bijna, maar de top komt nog','Laten liggen':'Nog niet op dronk — laten rijpen','Nog geen drinkadvies':'Wordt ingevuld bij de verrijking'};
function venster(w){if(!w.drinkvenster_vanaf_jaar&&!w.drinkvenster_tot_jaar)return'';const v=`venster ${w.drinkvenster_vanaf_jaar||'…'}–${w.drinkvenster_tot_jaar||'…'}`;
  return v+(w.beste_drinkmoment_vanaf?` · top ${w.beste_drinkmoment_vanaf}${w.beste_drinkmoment_tot&&w.beste_drinkmoment_tot!==w.beste_drinkmoment_vanaf?'–'+w.beste_drinkmoment_tot:''}`:'')}
const ORD={prijs:['Goedkoop (< €8)','Normaal (€8–15)','Duur (€15–25)','Extreem duur (€25+)','Prijs onbekend']};
function drawKelder(){
  const ws=S.kelder.filter(match), tot=ws.reduce((a,w)=>a+w.voorraad,0);
  if(!S.kelder.length) return $('#main').innerHTML=`<div class="empty-state"><h3>Je kelder is nog leeg</h3>Tik op <b>+</b> om flessen toe te voegen die je nu in huis hebt.<br><br><button class="btn" onclick="addFlow()">Eerste fles toevoegen</button></div>`;
  if(S.groep==='check'){const iw=ws.filter(w=>issues(w).length);
    return $('#main').innerHTML=terug('Controleren')+(iw.length?`<p class="sub">${iw.length} wijnen om na te lopen. Tik erop en kies <b>Gegevens bewerken</b>; na opslaan verdwijnt de wijn uit deze lijst. Ontbreekt er een fles helemaal? Voeg hem toe met <b>+</b>.</p><div class="list" style="margin-top:8px">${iw.map(w=>card(w,`<span class="iss">⚠ ${issues(w).join(' · ')}</span>`)).join('')}</div>`:'<div class="empty-state"><h3>Alles is gecontroleerd</h3>Geen ontbrekende gegevens in je kelder.</div>')}
  if(S.groep==='verplaats') return drawVerplaats(ws);
  const by={};const put=(k,item)=>(by[k]=by[k]||[]).push(item);
  if(S.groep==='zone'){
    const W=Object.fromEntries(ws.map(w=>[w.wijn_id,w]));
    S.vakken.filter(v=>W[v.wijn_id]).forEach(v=>put(ZNAAM[v.zone]+(v.vak?' · '+v.vak:''),{w:W[v.wijn_id],n:v.aantal,z:v.zone}));
  } else ws.forEach(w=>put(({kleur:w.wijnkleur,land:landNL(w.land)||'Onbekend',stijl:w.stijlfamilie||w.regionale_stijl||'Onbekende stijl',status:w.drinkstatus||'Nog geen drinkadvies',smaak:SM(w.smaakmatch),prijs:w.prijscategorie})[S.groep]||'Onbekend',{w,n:w.voorraad}));
  let keys=Object.keys(by);
  if(S.groep==='zone') keys.sort((a,b)=>ZONES.indexOf(by[a][0].z)-ZONES.indexOf(by[b][0].z)||a.localeCompare(b));
  else if(S.groep==='status') keys.sort((a,b)=>(PRIO[a]??9)-(PRIO[b]??9));
  else if(S.groep==='smaak'){const o=['JL','J','L','G',null].map(SM);keys.sort((a,b)=>o.indexOf(a)-o.indexOf(b))}
  else if(ORD[S.groep]) keys.sort((a,b)=>ORD[S.groep].indexOf(a)-ORD[S.groep].indexOf(b)); else keys.sort();
  $('#main').innerHTML=todoBox()+`<p class="sub">${tot} flessen · ${ws.length} wijnen</p>`+keys.map(k=>{
    const it=by[k].sort((a,b)=>(PRIO[a.w.drinkstatus]??9)-(PRIO[b.w.drinkstatus]??9)||naam(a.w).localeCompare(naam(b.w)));
    return `<div class="group"><h2>${esc(k)}</h2><span>${it.reduce((a,i)=>a+i.n,0)} fl.</span></div>${S.groep==='status'&&FASE[k]?`<p class="sub" style="margin:-4px 0 8px">${FASE[k]}</p>`:''}<div class="list">${cluster(it).map(cl=>gcard(cl)||card(cl[0].w,`<span class="cnt">${cl[0].n}×</span> ${S.groep!=='zone'?esc(cl[0].w.locaties||''):''} ${stag(cl[0].w.drinkstatus)}${venster(cl[0].w)?`<br><span class="muted">${venster(cl[0].w)}</span>`:''}`)).join('')}</div>`}).join('');
}

function nVerplaats(){const W=Object.fromEntries(S.kelder.map(w=>[w.wijn_id,w]));return S.vakken.filter(v=>W[v.wijn_id]?.zone_advies&&W[v.wijn_id].zone_advies!==v.zone).reduce((a,v)=>a+v.aantal,0)}
function todoBox(){const nv=nVerplaats(),nc=S.kelder.filter(w=>issues(w).length).length,today=new Date().toISOString().slice(0,10);
  if((!nv&&!nc)||ls.get('todo_hide','')===today+':'+nv+':'+nc)return'';
  return `<div class="sec" style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 12px;margin:4px 0 8px;position:relative;padding-right:46px"><b style="font-size:14px;white-space:nowrap">Te doen</b>
  ${nv?`<button class="chip" onclick="S.groep='verplaats';drawKelder();scrollTo(0,0)">↔ ${nv} verplaatsen</button>`:''}
  ${nc?`<button class="chip" onclick="S.groep='check';drawKelder();scrollTo(0,0)">⚠ ${nc} controleren</button>`:''}
  <button class="x" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);margin:0;width:30px;height:30px;font-size:14px" aria-label="Verbergen" onclick="ls.set('todo_hide','${today}:${nv}:${nc}');this.parentNode.remove()">✕</button></div>`}
function terug(t){return `<button class="chip" style="margin:6px 0 4px" onclick="S.groep=ls.get('groep','zone');if(['check','verplaats'].includes(S.groep))S.groep='zone';render()">← Terug naar kelder</button><h2 style="font-size:20px;margin:6px 0 4px">${t}</h2>`}
function drawVerplaats(ws){
  const W=Object.fromEntries(ws.map(w=>[w.wijn_id,w]));const occ={},after={};
  S.vakken.forEach(v=>{occ[v.zone]=(occ[v.zone]||0)+v.aantal});Object.assign(after,occ);
  const mv=S.vakken.filter(v=>W[v.wijn_id]&&W[v.wijn_id].zone_advies&&W[v.wijn_id].zone_advies!==v.zone).map(v=>({v,w:W[v.wijn_id]}));
  mv.forEach(m=>{after[m.v.zone]-=m.v.aantal;after[m.w.zone_advies]=(after[m.w.zone_advies]||0)+m.v.aantal});
  if(!mv.length) return $('#main').innerHTML=terug('Verplaatsen')+'<div class="empty-state"><h3>Alles ligt goed</h3>Elke fles ligt in de geadviseerde zone.</div>';
  const occRow=ZONES.map(z=>{const c=S.cap?.[z],o=after[z]||0;return `<div class="srow"><span>${ZNAAM[z]}</span><span style="color:${c&&o>c?'var(--bad)':'inherit'}">nu ${occ[z]||0} → na advies ${o}${c?' / '+c:''}</span></div>`}).join('');
  const by={};mv.forEach(m=>(by[m.w.zone_advies]=by[m.w.zone_advies]||[]).push(m));
  $('#main').innerHTML=terug('Verplaatsen')+`<div class="sec"><h3>Bezetting per zone</h3>${occRow}<p class="sub" style="margin-top:6px">Rood = past niet. Begin dan bovenaan de lijst: wat het dichtst bij zijn piek of eroverheen is, gaat voor.</p></div>`+
  ZONES.filter(z=>by[z]).map(z=>`<div class="group"><h2>Naar ${ZNAAM[z]}</h2><span>${by[z].reduce((a,m)=>a+m.v.aantal,0)} fl.</span></div><div class="list">${by[z].sort((a,b)=>(PRIO[a.w.drinkstatus]??9)-(PRIO[b.w.drinkstatus]??9)).map(m=>card(m.w,`<span class="cnt">${m.v.aantal}×</span> nu: ${esc(m.v.zone)}${m.v.vak?' · '+esc(m.v.vak):''} ${stag(m.w.drinkstatus)}`)).join('')}</div>`).join('');
}

/* ---------- geproefd ---------- */
async function geproefdView(){
  $('#hsub').innerHTML=filterbar('Zoek in geproefde wijnen…',`<div class="chips">${[['gedronken','Gedronken'],['rating','Hoogste eerst'],['laag','Laagste eerst'],['naam','Naam'],['liz','Liz']].map(([k,l])=>`<button class="chip ${S.sort===k?'on':''}" onclick="S.sort='${k}';render()">${l}</button>`).join('')}</div>`);
  if(S.sort==='gedronken') return gedronkenView();
  if(!S.geproefd) S.geproefd=await q(sb.from('wijn_overzicht').select(COLS).or('aantal_ratings_jeroen.gt.0,aantal_ratings_liz.gt.0').limit(5000));
  drawGeproefd();
}
async function gedronkenView(){
  const W='wijn_id,producent,wijnnaam_cuvee,jaargang,wijnkleur,regio,land,etiketfoto_url,flesfoto_url';
  if(!S.gedronken){
    const [dm,km]=await Promise.all([
      q(sb.from('drinkmomenten').select(`drinkmoment_id,datum,gelegenheid,gerecht,wijnen(${W}),proefnotities(persoon,eigen_rating,eigen_proefnotitie)`).order('datum',{ascending:false}).limit(300)),
      q(sb.from('voorraadmutaties').select(`datumtijd,reden,toelichting,wijnen(${W})`).in('reden',['Kapot','Weggegeven']).eq('testgegeven',false).order('datumtijd',{ascending:false}).limit(100))]);
    S.gedronken=[...dm.map(d=>({d:d.datum,w:d.wijnen,r:d.proefnotities||[],x:[d.gelegenheid,d.gerecht].filter(Boolean).join(' · ')})),
      ...km.map(m=>({d:m.datumtijd.slice(0,10),w:m.wijnen,r:[],x:(m.reden==='Kapot'?'✗ Bedorven / weggegooid':'Weggegeven')+(m.toelichting?' — '+m.toelichting:'')}))].filter(i=>i.w).sort((a,b)=>b.d.localeCompare(a.d));
  }
  const it=S.gedronken.filter(i=>match(i.w));
  if(!it.length) return $('#main').innerHTML='<div class="empty-state"><h3>Nog niets gedronken</h3>Tik bij een wijn in je kelder op <b>Drinken</b>; de fles verschijnt dan hier.</div>';
  let last='';
  $('#main').innerHTML=`<p class="sub">${it.length} flessen</p>`+it.map(i=>{
    const mo=new Date(i.d).toLocaleDateString('nl-NL',{month:'long',year:'numeric'});
    const h=mo!==last?`<div class="group"><h2>${mo}</h2></div>`:'';last=mo;
    const rj=i.r.find(r=>r.persoon==='Jeroen'),rl=i.r.find(r=>r.persoon==='Liz');
    const w={...i.w,rating_jeroen:rj?.eigen_rating??null,rating_liz:rl?.eigen_rating??null};
    return h+`<div class="list" style="margin-bottom:10px">${card(w,`${new Date(i.d).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}${i.x?' · '+esc(i.x):''}`)}</div>`}).join('');
}
function drawGeproefd(){
  const me=S.sort==='liz'?'rating_liz':S.ik==='Liz'?'rating_liz':'rating_jeroen';
  let ws=S.geproefd.filter(match); if(S.sort==='liz') ws=ws.filter(w=>w.rating_liz!=null);
  ws.sort(S.sort==='naam'?(a,b)=>naam(a).localeCompare(naam(b)):S.sort==='laag'?(a,b)=>(a[me]??9)-(b[me]??9):(a,b)=>(b[me]??-1)-(a[me]??-1));
  const cls=cluster(ws.map(w=>({w,n:w.voorraad})));
  const best=c=>Math.max(...c.map(i=>i.w[me]??-1)),worst=c=>Math.min(...c.map(i=>i.w[me]??9));
  if(S.sort==='naam')cls.sort((a,b)=>naam(a[0].w).localeCompare(naam(b[0].w)));else if(S.sort==='laag')cls.sort((a,b)=>worst(a)-worst(b));else cls.sort((a,b)=>best(b)-best(a));
  $('#main').innerHTML=`<p class="sub">${ws.length} wijnen · ${cls.length} unieke</p><div class="list" style="margin-top:8px">${cls.map(c=>gcard(c,'rating')||card(c[0].w,c[0].w.voorraad?`<span class="cnt">${c[0].w.voorraad}× in kelder</span>`:'')).join('')||'<div class="empty-state">Niets gevonden</div>'}</div>`;
}

/* ---------- ontdekken ---------- */
async function ontdekView(){
  $('#hsub').innerHTML=filterbar('Zoek producent, wijn, regio of druif…');
  ontdekSearch();
}
async function ontdekSearch(){
  let p=sb.from('wijn_overzicht').select(COLS);
  const t=S.q.trim().replace(/[,()%]/g,' ');
  if(t) t.split(/\s+/).filter(Boolean).forEach(x=>{const L=NLLAND[norm(x)];const y=ilk(x);p=/^\d{4}$/.test(x)?p.eq('jaargang',+x):p.or(`producent.ilike.%${y}%,wijnnaam_cuvee.ilike.%${y}%,regio.ilike.%${y}%,regionale_stijl.ilike.%${y}%,land.ilike.%${L||y}%,druiven.ilike.%${y}%`)});
  if(S.kleur) p=p.eq('wijnkleur',S.kleur);
  const col=S.ik==='Liz'?'likely_to_like_liz':'likely_to_like_jeroen';
  const ws=await q(p.order(col,{ascending:false,nullsFirst:false}).limit(60));
  $('#main').innerHTML=`<p class="sub">${t?'Resultaten':'Grootste kans dat '+(S.ik==='Liz'?'Liz':'jij')+' ze lekker vindt'}</p><div class="list" style="margin-top:8px">${ws.map(w=>card(w)).join('')||'<div class="empty-state">Niets gevonden</div>'}</div>`;
}

/* ---------- smaak ---------- */
async function smaakView(){
  $('#hsub').innerHTML='';
  if(!S.smaak) S.smaak=await q(sb.from('proefnotities').select('persoon,eigen_rating,wijnen(wijn_id,producent,wijnnaam_cuvee,jaargang,wijnkleur,land,regio,regionale_stijl,etiketfoto_url)').limit(10000));
  const rs=S.smaak.filter(r=>r.persoon===S.ik&&r.eigen_rating!=null&&r.wijnen);
  if(!rs.length) return $('#main').innerHTML=`<div class="empty-state"><h3>Nog geen beoordelingen van ${S.ik}</h3>Zodra ${S.ik} wijnen beoordeelt, verschijnt hier het smaakprofiel. De voorspellingen worden dan steeds beter.</div>`;
  const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const grp=k=>{const g={};rs.forEach(r=>{const v=r.wijnen[k];if(v)(g[v]=g[v]||[]).push(+r.eigen_rating)});return Object.entries(g).map(([k,a])=>({k,n:a.length,a:avg(a)}))};
  const stijl=grp('regionale_stijl').filter(x=>x.n>=3).sort((a,b)=>b.a-a.a);
  const kleur=grp('wijnkleur').sort((a,b)=>b.n-a.n);
  const top=[...rs].sort((a,b)=>b.eigen_rating-a.eigen_rating).slice(0,8);
  const row=x=>`<div class="srow"><span>${esc(x.k)} <span class="muted">(${x.n})</span></span><span>${x.a.toFixed(2)}</span></div>`;
  $('#main').innerHTML=`<div class="stat" style="margin-top:6px"><div><b>${rs.length}</b><i>beoordelingen</i></div><div><b>${avg(rs.map(r=>+r.eigen_rating)).toFixed(2)}</b><i>gemiddeld</i></div><div><b>${rs.filter(r=>r.eigen_rating>=4).length}</b><i>4,0 of hoger</i></div></div>
  <div class="sec"><h3>Per kleur</h3>${kleur.map(row).join('')}</div>
  <div class="sec"><h3>Favoriete stijlen</h3>${stijl.slice(0,8).map(row).join('')||'<p class="muted">Nog te weinig data</p>'}</div>
  <div class="sec"><h3>Minst favoriete stijlen</h3>${stijl.slice(-4).reverse().map(row).join('')}</div>
  <div class="sec"><h3>Topwijnen</h3>${top.map(r=>`<div class="srow" onclick="detail('${r.wijnen.wijn_id}')" style="cursor:pointer"><span>${esc(naam(r.wijnen))} ${r.wijnen.jaargang||''}</span><span>${f1(r.eigen_rating)}</span></div>`).join('')}</div>
  <p class="sub" style="margin-top:10px">Stijlen met minimaal 3 beoordelingen.</p>
  <div class="sec"><h3>Kelder verrijken</h3><p class="sub">Kopieert alle kelderwijnen die nog niet (of opnieuw) verrijkt moeten worden. Plak de tekst in de chat met Claude; je krijgt één SQL-bestand terug.</p><button class="btn full" onclick="exportVerrijking()">Kopieer voor verrijking</button></div>`;
}

/* ---------- sheet helpers ---------- */
function sheet(html){closeSheet();const bg=document.createElement('div');bg.className='sheet-bg';bg.id='sh';
  bg.innerHTML=`<div class="sheet"><button class="x" onclick="closeSheet()" aria-label="Sluiten">✕</button><div class="grab"></div>${html}</div>`;bg.onclick=e=>{if(e.target===bg)closeSheet()};document.body.appendChild(bg);document.body.style.overflow='hidden'}
function closeSheet(){$('#sh')?.remove();document.body.style.overflow=''}
function invalidate(){S.kelder=null;S.geproefd=null;S.smaak=null;S.gedronken=null}

/* ---------- detail ---------- */
async function detail(id){
  sheet('<div class="empty-state">Laden…</div>');
  const [[w],notes,vak,muts]=await Promise.all([
    q(sb.from('wijn_overzicht').select('*').eq('wijn_id',id)),
    q(sb.from('proefnotities').select('*').eq('wijn_id',id).order('aangemaakt',{ascending:false})),
    q(sb.from('voorraad_per_vak').select('*').eq('wijn_id',id)),
    q(sb.from('voorraadmutaties').select('*').eq('wijn_id',id).eq('testgegeven',false).order('datumtijd',{ascending:false}).limit(6))]);
  let sq=sb.from('wijn_overzicht').select('wijn_id,jaargang,voorraad,rating_jeroen,rating_liz,drinkstatus').eq('wijnnaam_cuvee',w.wijnnaam_cuvee);

</div>

/* ---------- wijn bewerken ---------- */
const EF=[['producent','Producent'],['wijnnaam_cuvee','Wijnnaam / cuvée'],['jaargang','Jaargang'],['land','Land'],['regio','Regio'],['druiven','Druiven'],['prijs_indicatie_eur','Prijs per fles (€)']];
function editWine(){const w=S.cur.w;
  sheet(`<h2>Gegevens bewerken</h2><p class="sub">${esc(naam(w))}</p>
  ${EF.map(([k,l])=>`<label class="f">${l}</label><input class="inp" id="e_${k}" value="${esc(w[k]??'')}" ${k==='jaargang'?'inputmode="numeric"':''}>`).join('')}
  <label class="f">Kleur</label><div class="seg" id="e_k">${KLEUREN.map(k=>`<button class="${w.wijnkleur===k?'on':''}">${k}</button>`).join('')}</div>
  <button class="btn full" id="go">Opslaan</button>`);
  $('#e_k').onclick=e=>{if(e.target.tagName==='BUTTON')$('#e_k').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target))};
  $('#go').onclick=async e=>{
    const v={};EF.forEach(([k])=>{const x=$('#e_'+k).value.trim();v[k]=k==='jaargang'?(parseInt(x)||null):k==='prijs_indicatie_eur'?(parseFloat(x.replace(',','.'))||null):(x||null)});
    if(v.prijs_indicatie_eur!=w.prijs_indicatie_eur)v.prijs_bron='Eigen invoer';
    if(['producent','wijnnaam_cuvee','jaargang'].some(k=>v[k]!=w[k])&&w.advies_bron!=='Eigen notitie op fles')v.advies_bron='Opnieuw verrijken';
    v.wijnkleur=$('#e_k .on')?.textContent||w.wijnkleur;
    if(!v.wijnnaam_cuvee)return toast('Wijnnaam is verplicht',1);
    if(issues(w).length||/te controleren/i.test(w.validatiestatus||''))v.validatiestatus='Gecontroleerd';
    e.target.disabled=true;
    try{
      // Andere jaargang bij een wijn met beoordelingen: oude jaargang intact laten, nieuwe aanmaken en voorraad overzetten
      if(v.jaargang!==w.jaargang&&(w.aantal_ratings_jeroen||w.aantal_ratings_liz)&&confirm(`Deze wijn heeft beoordelingen van jaargang ${w.jaargang||'onbekend'}. Wil je jaargang ${v.jaargang||'onbekend'} als aparte wijn aanmaken en de flessen in de kelder daarheen overzetten?`)){
        const base=Object.fromEntries(['producent','wijnnaam_cuvee','wijnkleur','land','regio','regionale_stijl','druiven','etiketfoto_url','vivino_url'].map(k=>[k,w[k]]));
        const [nw]=await q(sb.from('wijnen').insert({...base,...v,wijngegevens_bron:'App',validatiestatus:'Nieuwe jaargang van '+w.wijn_id}).select());
        const r=crypto.randomUUID?crypto.randomUUID():null;
        const m=S.cur.vak.flatMap(x=>[{wijn_id:w.wijn_id,aantal_delta:-x.aantal,reden:'Correctie',zone:x.zone,vak:x.vak||'',referentie_id:r,verwerkt_door:S.ik,toelichting:'Jaargang gecorrigeerd'},{wijn_id:nw.wijn_id,aantal_delta:x.aantal,reden:'Correctie',zone:x.zone,vak:x.vak||'',referentie_id:r,verwerkt_door:S.ik,toelichting:'Jaargang gecorrigeerd'}]);
        if(m.length)await q(sb.from('voorraadmutaties').insert(m));
        toast('Nieuwe jaargang aangemaakt');invalidate();render();return detail(nw.wijn_id);
      }
      await q(sb.from('wijnen').update(v).eq('wijn_id',w.wijn_id));
      toast('Opgeslagen');invalidate();render();detail(w.wijn_id);
    }catch(err){e.target.disabled=false}};
}
async function corrigeer(m){if(!confirm('Deze mutatie ongedaan maken? Er wordt een correctie vastgelegd.'))return;
  try{await q(sb.rpc('mutatie_corrigeren',{p_mutatie:m,p_door:S.ik}));toast('Gecorrigeerd');invalidate();detail(S.cur.w.wijn_id);render()}catch(e){}}

/* ---------- drinken + beoordelen ---------- */
function drinkFlow(i){const v=S.cur.vak[i],w=S.cur.w;
  sheet(`<h2>Fles openen</h2><p class="sub">${esc(naam(w))} ${w.jaargang||''} · uit ${esc(ZNAAM[v.zone])}${v.vak?' · '+esc(v.vak):''}</p>
  ${w.decanteeradvies?`<div class="sec"><b>Decanteren:</b> ${esc(w.decanteeradvies)}${w.decanteertijd_minuten?` · ${w.decanteertijd_minuten} min`:''}${w.serveertemperatuur_c?`<br><b>Schenken op:</b> ${w.serveertemperatuur_c}°C`:''}</div>`:''}
  <label class="f">Gelegenheid (optioneel)</label><input class="inp" id="gel" placeholder="bijv. etentje met vrienden">
  <label class="f">Gerecht (optioneel)</label><input class="inp" id="ger" placeholder="bijv. lamsrack">
  <button class="btn full" id="go">Fles gedronken · 1 afboeken</button>`);
  $('#go').onclick=async e=>{e.target.disabled=true;
    try{const dm=await q(sb.rpc('fles_drinken',{p_wijn:w.wijn_id,p_zone:v.zone,p_vak:v.vak||'',p_door:S.ik,p_gelegenheid:$('#gel').value||null,p_gerecht:$('#ger').value||null}));
      invalidate();toast('1 fles afgeboekt');rateFlow(w.wijn_id,dm)}catch(err){e.target.disabled=false}};
}
function pickDrink(){const v=S.cur.vak;if(v.length===1)return drinkFlow(0);
  sheet(`<h2>Uit welk vak?</h2><p class="sub">${esc(naam(S.cur.w))} ${S.cur.w.jaargang||''}</p>${v.map((x,i)=>`<button class="res" onclick="drinkFlow(${i})"><div><b>${x.aantal}× ${esc(ZNAAM[x.zone])}${x.vak?' · '+esc(x.vak):''}</b></div></button>`).join('')}`)}
function rateBlock(p){return `<div class="rate ${p}" data-p="${p}"><div class="rate-h"><h3>${p}</h3><span><span class="rate-n" style="font-size:18px;color:var(--muted)">geen cijfer</span> <button class="btn sm sec2" style="display:none" onclick="const r=this.closest('.rate');delete r.dataset.set;const n=r.querySelector('.rate-n');n.textContent='geen cijfer';n.style.cssText='font-size:18px;color:var(--muted)';this.style.display='none'">wis</button></span></div>
  <input type="range" min="1" max="5" step="0.1" value="3.5" oninput="const r=this.closest('.rate'),n=r.querySelector('.rate-n');n.textContent=(+this.value).toFixed(1);n.style.cssText='';r.dataset.set=1;r.querySelector('.rate-h .btn').style.display=''">
  <div class="tl-lab"><span>1</span><span>3</span><span>5</span></div><p class="sub" style="margin-top:2px">Schuif om een cijfer te geven (stappen van 0,1).</p>
  <label class="f">Waarom dit cijfer?</label><textarea class="inp nt" placeholder="Wat proef je, wat viel op? (dicteren via toetsenbord kan ook)"></textarea>
  <label class="f">Opnieuw kopen?</label><div class="seg ok">${['ja','misschien','nee'].map(x=>`<button onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===this&&!b.classList.contains('on')))">${x}</button>`).join('')}</div></div>`}
function rateFlow(id,dm){const w=S.cur?.w;
  const ppl=S.ik==='Liz'?['Liz','Jeroen']:['Jeroen','Liz'];
  sheet(`<h2>Beoordelen</h2><p class="sub">${esc(w?naam(w)+' '+(w.jaargang||''):'')}${dm?' · deze fles':''}. Schuif het cijfer om te beoordelen; wie niet beoordeelt, sla je gewoon over.</p>
  ${ppl.map(rateBlock).join('')}<button class="btn full" id="sv">Opslaan</button><button class="btn sec2 full" style="margin-top:8px" onclick="closeSheet();render()">Overslaan</button>`);
  $('#sv').onclick=async e=>{
    const rows=[...document.querySelectorAll('.rate')].filter(b=>b.dataset.set||b.querySelector('.nt').value.trim()).map(b=>({
      wijn_id:id,persoon:b.dataset.p,eigen_rating:b.dataset.set?+b.querySelector('input').value:null,
      eigen_proefnotitie:b.querySelector('.nt').value.trim()||null,opnieuw_kopen:b.querySelector('.seg .on')?.textContent||null,
      drinkmoment_id:dm||null,drinkdatum_bevestigd:dm?new Date().toISOString().slice(0,10):null,bron:'App'}));
    if(!rows.length){closeSheet();render();return}
    e.target.disabled=true;
    try{await q(sb.from('proefnotities').insert(rows));toast('Beoordeling opgeslagen');invalidate();closeSheet();render();detail(id)}catch(err){e.target.disabled=false}};
}

/* ---------- verplaatsen ---------- */
function moveFlow(i){const v=S.cur.vak[i],w=S.cur.w;let n=1,z=null;
  sheet(`<h2>Verplaatsen</h2><p class="sub">Van ${esc(ZNAAM[v.zone])}${v.vak?' · '+esc(v.vak):''} (${v.aantal} fl.)</p>
  <label class="f">Aantal</label><div class="stepper"><button id="mn">−</button><b id="nn">1</b><button id="pl">+</button></div>
  <label class="f">Naar zone</label><div class="seg" id="zs">${ZONES.map(x=>`<button data-z="${x}">${x}</button>`).join('')}</div>
  <label class="f">Plank / vak (optioneel)</label><input class="inp" id="vk" list="vkl"><datalist id="vkl">${vakList()}</datalist>
  <button class="btn full" id="go">Verplaatsen</button>`);
  $('#mn').onclick=()=>{n=Math.max(1,n-1);$('#nn').textContent=n};$('#pl').onclick=()=>{n=Math.min(v.aantal,n+1);$('#nn').textContent=n};
  $('#zs').onclick=e=>{if(e.target.dataset.z){z=e.target.dataset.z;$('#zs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target))}};
  $('#go').onclick=async e=>{if(!z)return toast('Kies een zone',1);const nv=$('#vk').value.trim();if(z===v.zone&&nv===(v.vak||''))return toast('Dat is dezelfde plek',1);
    e.target.disabled=true;try{await q(sb.rpc('fles_verplaatsen',{p_wijn:w.wijn_id,p_van_zone:v.zone,p_van_vak:v.vak||'',p_naar_zone:z,p_naar_vak:nv,p_aantal:n,p_door:S.ik}));
    toast('Verplaatst');invalidate();render();detail(w.wijn_id)}catch(err){e.target.disabled=false}};
}
function fixFlow(i){const v=S.cur.vak[i],w=S.cur.w;let n=v.aantal;
  sheet(`<h2>Aantal corrigeren</h2><p class="sub">${esc(naam(w))} ${w.jaargang||''} · ${esc(ZNAAM[v.zone])}${v.vak?' · '+esc(v.vak):''}</p>
  <p style="margin-top:10px">Hoeveel flessen liggen hier <b>echt</b>? Dit telt niet als gedronken; het wordt als correctie vastgelegd.</p>
  <div class="stepper" style="margin-top:12px"><button id="mn">−</button><b id="nn">${n}</b><button id="pl">+</button></div>
  <button class="btn full" id="go">Opslaan</button>`);
  $('#mn').onclick=()=>{n=Math.max(0,n-1);$('#nn').textContent=n};$('#pl').onclick=()=>{n++;$('#nn').textContent=n};
  $('#go').onclick=async e=>{const d=n-v.aantal;if(!d)return closeSheet();e.target.disabled=true;
    try{await q(sb.from('voorraadmutaties').insert({wijn_id:w.wijn_id,aantal_delta:d,reden:'Correctie',zone:v.zone,vak:v.vak||'',verwerkt_door:S.ik,toelichting:`Aantal gecorrigeerd van ${v.aantal} naar ${n}`}));
      toast('Aantal gecorrigeerd');invalidate();render();detail(w.wijn_id)}catch(err){e.target.disabled=false}};
}
async function uploadFoto(f){if(!f)return;const w=S.cur.w;toast('Foto uploaden…');
  try{const img=await createImageBitmap(f);const k=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));const path=`${w.wijn_id}-${Date.now()}.jpg`;
    const {error}=await sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
    const url=sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
    await q(sb.from('wijnen').update({flesfoto_url:url}).eq('wijn_id',w.wijn_id));toast('Foto opgeslagen');invalidate();render();detail(w.wijn_id)}
  catch(e){console.error(e);toast('Uploaden mislukt: '+(e.message||e),1)}}
async function exportVerrijking(){
  const ws=await q(sb.from('wijn_overzicht').select('wijn_id,producent,wijnnaam_cuvee,jaargang,wijnkleur,land,regio,regionale_stijl,druiven,stijlfamilie,advies_bron,drinkvenster_vanaf_jaar,drinkvenster_tot_jaar,decanteertoelichting,prijs,rating_jeroen,notitie_jeroen,vivino_gemiddelde,voorraad').gt('voorraad',0));
  const todo=ws.filter(w=>!w.stijlfamilie||w.advies_bron==='Opnieuw verrijken').map(w=>Object.fromEntries(Object.entries({...w,notitie_jeroen:w.notitie_jeroen?.slice(0,140)}).filter(([k,v])=>v!=null&&v!=='')));
  if(!todo.length)return toast('Alles is al verrijkt');
  const txt='VERRIJKEN '+todo.length+' wijnen\n'+JSON.stringify(todo);
  try{await navigator.clipboard.writeText(txt);toast(`${todo.length} wijnen gekopieerd — plak in de chat met Claude`)}
  catch(e){sheet(`<h2>Kopieer deze tekst</h2><textarea class="inp" style="min-height:50vh">${esc(txt)}</textarea>`)}
}
function vakList(){return [...new Set((S.vakken||[]).map(v=>v.vak).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}

function addFlow(id){
  if(id) return addForm(S.cur.w);
  sheet(`<h2>Flessen toevoegen</h2><p class="sub">Zoek de wijn in je bibliotheek (2.000+ wijnen uit Vivino).</p>
  <input class="search" id="as" placeholder="Producent, wijnnaam, jaargang…" autofocus><div id="ar"></div>
  <button class="btn sec2 full" onclick="newWine()">Staat er niet tussen → nieuwe wijn</button>`);
  let t;$('#as').oninput=e=>{clearTimeout(t);t=setTimeout(async()=>{const v=e.target.value.trim().replace(/[,()%]/g,' ');if(v.length<2)return $('#ar').innerHTML='';
    let p=sb.from('wijnen').select('wijn_id,producent,wijnnaam_cuvee,jaargang,wijnkleur,regio,land,etiketfoto_url,flesfoto_url,bewaarzone_advies');
    v.split(/\s+/).filter(Boolean).forEach(x=>{const y=ilk(x);p=/^\d{4}$/.test(x)?p.eq('jaargang',+x):p.or(`producent.ilike.%${y}%,wijnnaam_cuvee.ilike.%${y}%`)});
    const r=await q(p.order('jaargang',{ascending:false,nullsFirst:false}).limit(20));S.addRes=r;
    $('#ar').innerHTML=r.map((w,i)=>`<button class="res" onclick="addForm(S.addRes[${i}])">${lbl(w)}<div><b>${esc(naam(w))}</b><div class="cmeta">${esc(meta(w))}</div></div></button>`).join('')||'<p class="sub" style="padding:10px 0">Geen resultaat.</p>'},220)};
}
function newWine(){
  sheet(`<h2>Nieuwe wijn</h2>
  <label class="f">Producent</label><input class="inp" id="nw_p">
  <label class="f">Wijnnaam / cuvée *</label><input class="inp" id="nw_n">
  <div class="row"><div style="flex:1"><label class="f">Jaargang</label><input class="inp" id="nw_j" inputmode="numeric" placeholder="bijv. 2021"></div>
  <div style="flex:1"><label class="f">Land</label><input class="inp" id="nw_l"></div></div>
  <label class="f">Regio</label><input class="inp" id="nw_r">
  <label class="f">Druiven</label><input class="inp" id="nw_d">
  <label class="f">Kleur *</label><div class="seg" id="nw_k">${KLEUREN.map(k=>`<button>${k}</button>`).join('')}</div>
  <button class="btn full" id="go">Verder</button>`);
  let k=null;$('#nw_k').onclick=e=>{if(e.target.tagName==='BUTTON'){k=e.target.textContent;$('#nw_k').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target))}};
  $('#go').onclick=async e=>{const n=$('#nw_n').value.trim();if(!n||!k)return toast('Vul wijnnaam en kleur in',1);
    const j=parseInt($('#nw_j').value)||null,pr=$('#nw_p').value.trim()||null;
    if(!e.target.dataset.force){
      const words=norm((pr||'')+' '+n).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>=4&&!['chateau','domaine','bodegas','weingut','cuvee','reserve'].includes(x)).sort((x,y)=>y.length-x.length).slice(0,2);
      let cand=[];for(const wd of words){const y=ilk(wd);cand=cand.concat(await q(sb.from('wijnen').select('wijn_id,producent,wijnnaam_cuvee,jaargang,wijnkleur,regio,land,etiketfoto_url').or(`producent.ilike.%${y}%,wijnnaam_cuvee.ilike.%${y}%`).limit(30)))}
      const key=norm((pr||'')+' '+n).replace(/[^a-z0-9]/g,'');
      const hits=[...new Map(cand.map(c=>[c.wijn_id,c])).values()].map(c=>{const k=norm(naam(c)).replace(/[^a-z0-9]/g,'');let s=words.filter(wd=>k.includes(wd)).length*2;if(j&&c.jaargang===j)s+=2;if(k.includes(norm(n).replace(/[^a-z0-9]/g,''))||key.includes(k))s+=3;return {c,s}}).filter(h=>h.s>=3).sort((x,y)=>y.s-x.s).slice(0,5);
      if(hits.length){S.dups=hits.map(h=>h.c);
        $('#sh .sheet').insertAdjacentHTML('beforeend',`<div class="sec" id="dupbox" style="border-color:var(--warn)"><h3>Bestaat deze wijn al?</h3>${S.dups.map((c,i)=>`<button class="res" onclick="addForm(S.dups[${i}])">${lbl(c)}<div><b>${esc(naam(c))}</b><div class="cmeta">${esc(meta(c))}</div></div></button>`).join('')}<p class="sub" style="margin-top:8px">Tik op de juiste wijn, of druk nog een keer op <b>Verder</b> om toch een nieuwe aan te maken.</p></div>`);
        e.target.dataset.force=1;$('#dupbox').scrollIntoView({behavior:'smooth'});return}
    }
    e.target.disabled=true;
    try{const [w]=await q(sb.from('wijnen').insert({producent:pr,wijnnaam_cuvee:n,jaargang:j,wijnkleur:k,land:$('#nw_l').value.trim()||null,regio:$('#nw_r').value.trim()||null,druiven:$('#nw_d').value.trim()||null,wijngegevens_bron:'App',validatiestatus:'Handmatig ingevoerd'}).select());addForm(w)}catch(err){e.target.disabled=false}};
}
function recZone(w){if(w.bewaarzone_advies&&ZONES.includes(w.bewaarzone_advies))return w.bewaarzone_advies;return ['Wit','Rosé','Mousserend'].includes(w.wijnkleur)?'8°C':'16°C'}
async function addForm(w){
  if(!S.vakken.length) try{S.vakken=await q(sb.from('voorraad_per_vak').select('*'))}catch(e){}
  let n=1,z=recZone(w),r='Inventarisatie';
  sheet(`<div class="hero">${lbl(w)}<div><h2>${esc(naam(w))}</h2><p class="sub">${esc(meta(w))}</p></div></div>
  <label class="f">Aantal flessen</label><div class="stepper"><button id="mn">−</button><b id="nn">1</b><button id="pl">+</button></div>
  <label class="f">Zone <span class="muted">(groen omrand = advies)</span></label><div class="seg" id="zs">${ZONES.map(x=>`<button data-z="${x}" class="${x===z?'on ':''}${x===recZone(w)?'rec':''}">${x}</button>`).join('')}</div>
  <label class="f">Plank / vak (optioneel)</label><input class="inp" id="vk" list="vkl" placeholder="bijv. plank 3"><datalist id="vkl">${vakList()}</datalist>
  <label class="f">Herkomst</label><div class="seg" id="rs"><button data-r="Inventarisatie" class="on">Lag al in huis</button><button data-r="Aankoop">Net gekocht</button></div>
  <div id="ak" style="display:none"><div class="row"><div style="flex:1"><label class="f">Prijs per fles (€)</label><input class="inp" id="pr" inputmode="decimal"></div>
  <div style="flex:1"><label class="f">Winkel</label><input class="inp" id="lv"></div></div></div>
  <button class="btn full" id="go">Toevoegen aan kelder</button>`);
  $('#mn').onclick=()=>{n=Math.max(1,n-1);$('#nn').textContent=n};$('#pl').onclick=()=>{n++;$('#nn').textContent=n};
  $('#zs').onclick=e=>{if(e.target.dataset.z){z=e.target.dataset.z;$('#zs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target))}};
  $('#rs').onclick=e=>{if(e.target.dataset.r){r=e.target.dataset.r;$('#rs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target));$('#ak').style.display=r==='Aankoop'?'':'none'}};
  $('#go').onclick=async e=>{e.target.disabled=true;const vak=$('#vk').value.trim();
    try{
      if(r==='Aankoop'){const prijs=parseFloat(($('#pr').value||'').replace(',','.'))||null,lev=$('#lv').value.trim()||null;
        const [a]=await q(sb.from('aankopen').insert({leverancier:lev}).select());
        await q(sb.from('aankoopregels').insert({aankoop_id:a.aankoop_id,wijn_id:w.wijn_id,aantal:n,prijs_per_fles_eur:prijs,zone:z,vak}))}
      await q(sb.from('voorraadmutaties').insert({wijn_id:w.wijn_id,aantal_delta:n,reden:r,zone:z,vak,verwerkt_door:S.ik}));
      toast(`${n} fles${n>1?'sen':''} toegevoegd`);invalidate();closeSheet();S.tab='kelder';ls.set('tab','kelder');render();
    }catch(err){e.target.disabled=false}};
}
const VERSIE='2026-11-02e';
// Updatecheck: haalt de live versie op zonder cache; bij een nieuwere versie herlaadt de app zichzelf (ook vanaf het beginscherm)
async function checkUpdate(){try{const t=await (await fetch(location.pathname+'?u='+Date.now(),{cache:'no-store'})).text();
  const m=t.match(/const VERSIE='([^']+)'/);if(m&&m[1]!==VERSIE){toast('Nieuwe versie — even herladen…');setTimeout(()=>location.replace(location.pathname+'?v='+m[1]),800)}}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
checkUpdate();
start();
</script>
