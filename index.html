<style>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#24181a; --muted:#7d6f6a; --line:#e6ddd2;
  --wine:#7b1e2f; --wine-soft:#f3e3e3; --liz:#2f6f6a; --liz-soft:#e0eeec;
  --viv:#8a7a5c; --viv-soft:#efe9dc; --pred:#a8742a;
  --ok:#3d7a3a; --warn:#b5702a; --bad:#a3352f;
  --shadow:0 1px 2px rgba(40,20,20,.06),0 4px 14px rgba(40,20,20,.06);
  --r:16px; --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171113; --card:#221a1c; --ink:#f1e8e4; --muted:#a8999a; --line:#3a2e30;
  --wine:#e0707f; --wine-soft:#3d2228; --liz:#6cc0b7; --liz-soft:#1e3533;
  --viv:#c9b98f; --viv-soft:#332d22; --pred:#e0a85a; --shadow:none;}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:26px}
.who{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.who button{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--muted)}
.who button.on{background:var(--ink);color:var(--bg)}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.search{margin-top:10px;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted)}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
main{padding:4px 16px 20px;max-width:760px;margin:0 auto}
.group{margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between}
.group h2{font-size:18px}
.group span{color:var(--muted);font-size:13px}
.list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:700px){.list{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.card{display:flex;gap:12px;min-width:0;overflow:hidden;background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);border:1px solid var(--line);text-align:left;width:100%}
.lbl{width:62px;height:84px;flex:none;border-radius:10px;background:var(--wine-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;color:var(--wine);overflow:hidden;position:relative}
.lbl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--card)}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cname{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cmeta{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.scores{display:flex;gap:5px;flex-wrap:wrap}
.sc{min-width:42px;padding:3px 6px 2px;border-radius:9px;text-align:center;line-height:1.1}
.sc b{display:block;font-size:15px;font-weight:600}
.sc i{font-style:normal;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.sc.j{background:var(--wine-soft);color:var(--wine)}
.sc.l{background:var(--liz-soft);color:var(--liz)}
.sc.v{background:var(--viv-soft);color:var(--viv)}
.sc.p{border:1.5px dashed var(--pred);color:var(--pred)}
.sc.empty{opacity:.35}
.cnt{font-weight:600;font-size:13px;white-space:nowrap}
.vts{display:flex;gap:4px;flex-wrap:wrap}.vt{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}.vt b{color:var(--wine);font-weight:600}
.iss{font-size:11.5px;color:var(--bad);font-weight:500}
.tonight{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 4px}
.tn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow)}
.tn .lbl{width:100%;height:78px;font-size:20px;border-radius:9px}
.tn b{font-family:var(--serif);font-size:13px;line-height:1.2;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tn small{font-size:11px;color:var(--muted);line-height:1.25}
.vrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}.vrow:first-of-type{border-top:0}.vrow.cur{font-weight:600;color:var(--wine)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--viv-soft);color:var(--viv);font-weight:500}
.tag.best{background:#e3f0df;color:var(--ok)}.tag.nu{background:#f8e6d3;color:var(--warn)}.tag.over{background:#f6dcda;color:var(--bad)}
.empty-state{text-align:center;color:var(--muted);padding:40px 16px}
.empty-state h3{color:var(--ink);font-size:20px;margin-bottom:6px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 10px;min-width:60px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--wine)}
nav .plus{width:52px;height:52px;border-radius:50%;background:var(--wine);color:#fff;margin-top:-26px;box-shadow:0 6px 18px rgba(123,30,47,.35);justify-content:center;padding:0;min-width:0}
nav .plus svg{width:26px;height:26px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;overflow-x:hidden;position:relative;border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.x{position:sticky;top:0;float:right;margin:-2px -4px 0 8px;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1;color:var(--muted);z-index:2}
.hero h2,.cname,.sheet h2{overflow-wrap:anywhere}
@keyframes up{from{transform:translateY(30px);opacity:.5}}@keyframes fade{from{opacity:0}}
.hero{display:flex;gap:14px;align-items:flex-start}
.hero .lbl{width:92px;height:126px}
.hero h2{font-size:22px;line-height:1.15}
.big-scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.bs{border-radius:14px;padding:10px 6px 8px;text-align:center}
.bs b{font-family:var(--serif);font-size:26px;display:block;line-height:1}
.bs i{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.bs.j{background:var(--wine-soft);color:var(--wine)}.bs.l{background:var(--liz-soft);color:var(--liz)}.bs.v{background:var(--viv-soft);color:var(--viv)}.bs.p{border:1.5px dashed var(--pred);color:var(--pred)}
.bs.empty b{opacity:.3}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.sec h3{font-size:15px;margin-bottom:8px}
.note{border-left:3px solid var(--wine);padding:2px 0 2px 10px;margin:10px 0}
.note.Liz{border-color:var(--liz)}
.note small{color:var(--muted);font-size:12px;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.timeline{position:relative;height:34px;margin:8px 0 2px}
.tl-bar{position:absolute;top:12px;height:8px;border-radius:8px;background:var(--viv-soft)}
.tl-best{position:absolute;top:12px;height:8px;border-radius:8px;background:var(--ok)}
.tl-now{position:absolute;top:4px;width:2px;height:24px;background:var(--ink)}
.tl-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar div{height:6px;border-radius:6px;background:var(--line);overflow:hidden}.bar div span{display:block;height:100%;background:var(--wine)}
.loc{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.loc:first-of-type{border-top:0}
.btn{padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--wine);color:#fff;text-align:center}
.btn.sec2{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%;margin-top:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
textarea.inp{min-height:70px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:56px;white-space:nowrap;padding:10px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button.rec{border-color:var(--ok)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px}
.stepper b{font-family:var(--serif);font-size:28px;min-width:30px;text-align:center}
.rate{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.rate.Jeroen{border-top:4px solid var(--wine)}.rate.Liz{border-top:4px solid var(--liz)}
.rate-h{display:flex;justify-content:space-between;align-items:center}
.rate-n{font-family:var(--serif);font-size:40px;line-height:1}
.rate.Jeroen .rate-n{color:var(--wine)}.rate.Liz .rate-n{color:var(--liz)}
input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--wine)}
.rate.Liz input[type=range]{accent-color:var(--liz)}
.res{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.res .lbl{width:36px;height:48px;font-size:14px;border-radius:7px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90vw;animation:fade .2s}
.toast.err{background:var(--bad);color:#fff}
.login{max-width:360px;margin:12vh auto 0;padding:0 16px}
.login h1{font-size:38px;margin-bottom:4px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{font-family:var(--serif);font-size:24px;display:block}
.stat i{font-style:normal;font-size:12px;color:var(--muted)}
.srow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-of-type{border-top:0}
.srow span:last-child{font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
.mut{font-size:13px;display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.lade{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;box-shadow:var(--shadow)}
.lade h4{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px}.lade h4 small{color:var(--muted);font-weight:400}
.lade .lab{font-size:12px;color:var(--muted);margin:2px 0 6px}.lade .pos{font-size:11px;color:var(--muted);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.fill{height:4px;border-radius:2px;background:var(--line);margin:6px 0}.fill span{display:block;height:100%;border-radius:2px;background:var(--ok)}.fill.vol span{background:var(--bad)}
.kc{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;margin:2px 3px 2px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-left:4px solid var(--viv);text-align:left}
.kc.s-eerst{border-left-color:var(--bad)}.kc.s-nu{border-left-color:var(--ok)}.kc.s-bewaar{border-left-color:var(--pred)}
.kc.mv{border-style:dashed;border-left-style:solid}.kc i{font-style:normal;color:var(--muted);font-size:11px}
.zkop{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 2px}.zkop h2{font-size:18px;margin:0}
.ofl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}.ofl:first-of-type{border-top:0}
</style>

<script>

const ZONES=['8°C','10°C','16°C','18°C'];

const COLS='wijn_id,producent,wijnnaam_cuvee,jaargang,wijnkleur,land,regio,regionale_stijl,druiven,etiketfoto_url,flesfoto_url,vivino_gemiddelde,likely_to_like_jeroen,likely_to_like_liz,match_betrouwbaarheid_jeroen,match_betrouwbaarheid_liz,voorraad,locaties,rating_jeroen,rating_liz,aantal_ratings_jeroen,aantal_ratings_liz,drinkstatus,bewaarzone_advies,validatiestatus,body,zuren,tannines,fruit,houtgebruik,zone_advies,smaakmatch,prijscategorie,drinkvenster_vanaf_jaar,drinkvenster_tot_jaar,beste_drinkmoment_vanaf,beste_drinkmoment_tot,prijs,prijs_indicatie_eur,laatste_prijs,advies_bron,stijlfamilie,bewaarwijn';
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const $=s=>document.querySelector(s);

const LANDNL={France:'Frankrijk',Spain:'Spanje',Italy:'Italië',Germany:'Duitsland',Austria:'Oostenrijk',Portugal:'Portugal','South Africa':'Zuid-Afrika',Argentina:'Argentinië',Chile:'Chili','United States':'Verenigde Staten',Netherlands:'Nederland',Hungary:'Hongarije',Australia:'Australië','New Zealand':'Nieuw-Zeeland',Greece:'Griekenland',Slovenia:'Slovenië',Switzerland:'Zwitserland',Lebanon:'Libanon',Uruguay:'Uruguay',Croatia:'Kroatië',Georgia:'Georgië',Israel:'Israël',Romania:'Roemenië',Bulgaria:'Bulgarije',England:'Engeland',Canada:'Canada',Moldova:'Moldavië',Brazil:'Brazilië',Mexico:'Mexico',Belgium:'België',Luxembourg:'Luxemburg',Turkey:'Turkije',Morocco:'Marokko',Cyprus:'Cyprus',Slovakia:'Slowakije','Czech Republic':'Tsjechië',Denmark:'Denemarken',fr:'Frankrijk'};

const NLERR={'Onvoldoende':'Er ligt hier geen fles meer'};

function imgs(w){const a=[];if(w.flesfoto_url)a.push(w.flesfoto_url);const e=w.etiketfoto_url;

function stag(s){if(!s)return'';const c={'Nu perfect':'best','Bijna op dronk':'','Nog net te drinken':'nu','Over de top':'over'}[s]||'';return `<span class="tag ${c}">${esc(s)}</span>`}
const wkey=w=>((w.producent||'')+'|'+(w.wijnnaam_cuvee||'')).toLowerCase().replace(/\s+/g,' ').trim();
const metaNV=w=>[w.regio||landNL(w.land),w.wijnkleur].filter(Boolean).join(' · ');
function cluster(items){const m=new Map();items.forEach(i=>{const k=wkey(i.w);if(!m.has(k))m.set(k,[]);m.get(k).push(i)});return [...m.values()].map(c=>c.sort((a,b)=>(b.w.jaargang||0)-(a.w.jaargang||0)))}
function gcard(cl,mode){if(cl.length===1)return null;
  const p=(cl.find(i=>i.w.rating_jeroen!=null||i.w.rating_liz!=null)||cl[0]).w, tot=cl.reduce((a,i)=>a+(i.n||0),0);
  const chips=cl.map(i=>`<span class="vt">${i.w.jaargang||'NV'}${mode==='rating'?(i.w.rating_jeroen!=null?` · <b>${f1(i.w.rating_jeroen)}</b>`:''):` · ${i.n}×`}</span>`).join('');
  return `<button class="card" onclick="detail('${p.wijn_id}')">${lbl(p)}<div class="cbody">
  <div class="cname">${esc(naam(p))}</div><div class="cmeta">${esc(metaNV(p))} · ${cl.length} jaargangen${tot&&mode!=='rating'?` · <b>${tot} fl.</b>`:''}</div>
  <div class="vts">${chips}</div><div class="crow">${scores(p)}</div></div></button>`}
function issues(w){const r=[];if(w.validatiestatus==='Gecontroleerd')return r;
  if(!w.jaargang&&w.wijnkleur!=='Mousserend')r.push('geen jaargang');
  if(!w.producent)r.push('geen producent');
  if(/te controleren/i.test(w.validatiestatus||''))r.push('naam/producent onzeker');
  if(/[?…]/.test(naam(w)))r.push('naam onvolledig');
  return r}
function card(w,extra){return `<button class="card" onclick="detail('${w.wijn_id}')">${lbl(w)}<div class="cbody">
  <div class="cname">${esc(naam(w))}</div><div class="cmeta">${esc(meta(w))}</div>
  ${extra?`<div class="cmeta">${extra}</div>`:''}
  <div class="crow">${scores(w)}</div></div></button>`}

function filterbar(placeholder,groups){

  <div class="chips">${['',...KLEUREN].map(k=>`<button class="chip ${S.kleur===k?'on':''}" onclick="S.kleur='${k}';render()">${k||'Alles'}</button>`).join('')}</div>

let rt;function refresh(){clearTimeout(rt);rt=setTimeout(()=>({kelder:drawKelder,geproefd:()=>S.sort==='gedronken'?gedronkenView():drawGeproefd(),ontdek:()=>S.omode==='bijkopen'?bijkopen():ontdekSearch()})[S.tab]?.(),180)}
const match=w=>{if(S.kleur&&w.wijnkleur!==S.kleur)return false;if(!S.q)return true;const t=norm([naam(w),w.jaargang,w.regio,w.land,landNL(w.land),w.wijnkleur,w.druiven,w.regionale_stijl,w.stijlfamilie].join(' '));return norm(S.q).split(/\s+/).filter(Boolean).every(x=>t.includes(x))};

/* ---------- kelder ---------- */
async function kelderView(){
  const G={zone:'Zone',kaart:'Kaart',status:'Drinkmoment',smaak:'Smaakmatch',prijs:'Prijs',kleur:'Kleur',land:'Land',stijl:'Stijl'};
  $('#hsub').innerHTML=filterbar('Zoek in kelder…',`<div class="chips">${Object.entries(G).map(([k,l])=>`<button class="chip ${S.groep===k?'on':''}" onclick="S.groep='${k}';ls.set('groep','${k}');drawKelder();this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===this))">${l}</button>`).join('')}</div>`);
  if(!S.kelder){
    const [w,v,z]=await Promise.all([q(sb.from('wijn_overzicht').select(COLS).gt('voorraad',0)),q(sb.from('voorraad_per_vak').select('*')),q(sb.from('bewaarzones').select('zone,capaciteit'))]);
    S.kelder=w;S.vakken=v;S.cap=Object.fromEntries(z.map(x=>[x.zone,x.capaciteit]));
    const [kv,op]=await Promise.all([sb.from('kastvakken').select('*'),sb.from('open_flessen').select('*').is('leeg_op',null)]);
    S.kv=kv.data||[];S.open=op.data||[];
  }
  drawKelder();
}
const PRIO={'Over de top':0,'Nog net te drinken':1,'Nu perfect':2,'Drinkbaar':3,'Bijna op dronk':4,'Laten liggen':5};
const SM=c=>{const me=S.ik,o=me==='Liz'?'Jeroen':'Liz';return({J:me==='Jeroen'?'Voor mij':'Voor Jeroen',JL:'Voor mij & '+o,L:me==='Liz'?'Voor mij':'Voor Liz',G:'Voor gasten'})[c]||'Nog onbekend'};
const FASE={'Over de top':'Voorbij het drinkvenster — zo snel mogelijk opdrinken','Nog net te drinken':'Piek is voorbij, nog binnen het venster — binnenkort drinken','Nu perfect':'In de optimale periode — nu drinken','Drinkbaar':'Binnen het drinkvenster; topperiode nog onbekend','Bijna op dronk':'Al drinkbaar of bijna, maar de top komt nog','Laten liggen':'Nog niet op dronk — laten rijpen','Nog geen drinkadvies':'Wordt ingevuld bij de verrijking'};
function venster(w){if(!w.drinkvenster_vanaf_jaar&&!w.drinkvenster_tot_jaar)return'';const v=`venster ${w.drinkvenster_vanaf_jaar||'…'}–${w.drinkvenster_tot_jaar||'…'}`;
  return v+(w.beste_drinkmoment_vanaf?` · top ${w.beste_drinkmoment_vanaf}${w.beste_drinkmoment_tot&&w.beste_drinkmoment_tot!==w.beste_drinkmoment_vanaf?'–'+w.beste_drinkmoment_tot:''}`:'')}
const ORD={prijs:['Goedkoop (< €8)','Normaal (€8–15)','Duur (€15–25)','Extreem duur (€25+)','Prijs onbekend']};
function drawKelder(){
  const ws=S.kelder.filter(match), tot=ws.reduce((a,w)=>a+w.voorraad,0);
  if(!S.kelder.length) return $('#main').innerHTML=`<div class="empty-state"><h3>Je kelder is nog leeg</h3>Tik op <b>+</b> om flessen toe te voegen die je nu in huis hebt.<br><br><button class="btn" onclick="addFlow()">Eerste fles toevoegen</button></div>`;
  if(S.groep==='check'){const iw=ws.filter(w=>issues(w).length);
    return $('#main').innerHTML=terug('Controleren')+(iw.length?`<p class="sub">${iw.length} wijnen om na te lopen. Tik erop en kies <b>Gegevens bewerken</b>; na opslaan verdwijnt de wijn uit deze lijst. Ontbreekt er een fles helemaal? Voeg hem toe met <b>+</b>.</p><div class="list" style="margin-top:8px">${iw.map(w=>card(w,`<span class="iss">⚠ ${issues(w).join(' · ')}</span>`)).join('')}</div>`:'<div class="empty-state"><h3>Alles is gecontroleerd</h3>Geen ontbrekende gegevens in je kelder.</div>')}
  if(S.groep==='verplaats') return drawVerplaats(ws);
  if(S.groep==='kaart') return drawKaart();
  const by={};const put=(k,item)=>(by[k]=by[k]||[]).push(item);
  if(S.groep==='zone'){
    const W=Object.fromEntries(ws.map(w=>[w.wijn_id,w]));
    S.vakken.filter(v=>W[v.wijn_id]).forEach(v=>put(ZNAAM[v.zone]+(v.vak?' · '+v.vak:''),{w:W[v.wijn_id],n:v.aantal,z:v.zone}));
  } else ws.forEach(w=>put(({kleur:w.wijnkleur,land:landNL(w.land)||'Onbekend',stijl:w.stijlfamilie||w.regionale_stijl||'Onbekende stijl',status:w.drinkstatus||'Nog geen drinkadvies',smaak:SM(w.smaakmatch),prijs:w.prijscategorie})[S.groep]||'Onbekend',{w,n:w.voorraad}));
  let keys=Object.keys(by);
  if(S.groep==='zone') keys.sort((a,b)=>ZONES.indexOf(by[a][0].z)-ZONES.indexOf(by[b][0].z)||a.localeCompare(b));
  else if(S.groep==='status') keys.sort((a,b)=>(PRIO[a]??9)-(PRIO[b]??9));
  else if(S.groep==='smaak'){const o=['JL','J','L','G',null].map(SM);keys.sort((a,b)=>o.indexOf(a)-o.indexOf(b))}
  else if(ORD[S.groep]) keys.sort((a,b)=>ORD[S.groep].indexOf(a)-ORD[S.groep].indexOf(b)); else keys.sort();
  $('#main').innerHTML=todoBox()+(S.q?'':openBlok()+vanavond())+`<p class="sub">${tot} flessen · ${ws.length} wijnen</p>`+keys.map(k=>{
    const it=by[k].sort((a,b)=>(PRIO[a.w.drinkstatus]??9)-(PRIO[b.w.drinkstatus]??9)||naam(a.w).localeCompare(naam(b.w)));
    return `<div class="group"><h2>${esc(k)}</h2><span>${it.reduce((a,i)=>a+i.n,0)} fl.</span></div>${S.groep==='status'&&FASE[k]?`<p class="sub" style="margin:-4px 0 8px">${FASE[k]}</p>`:''}<div class="list">${cluster(it).map(cl=>gcard(cl)||card(cl[0].w,`<span class="cnt">${cl[0].n}×</span> ${S.groep!=='zone'?esc(cl[0].w.locaties||''):''} ${stag(cl[0].w.drinkstatus)}${venster(cl[0].w)?`<br><span class="muted">${venster(cl[0].w)}</span>`:''}`)).join('')}</div>`}).join('');
}

function nVerplaats(){const W=Object.fromEntries(S.kelder.map(w=>[w.wijn_id,w]));return S.vakken.filter(v=>W[v.wijn_id]?.zone_advies&&W[v.wijn_id].zone_advies!==v.zone).reduce((a,v)=>a+v.aantal,0)}
const URG={'Over de top':3,'Nog net te drinken':2.5,'Nu perfect':1.5,'Drinkbaar':1,'Bijna op dronk':0,'Laten liggen':-3};
function vanavond(){const me=S.ik==='Liz'?'liz':'jeroen';
  const ws=S.kelder.filter(w=>(!S.kleur||w.wijnkleur===S.kleur)&&w.drinkstatus).map(w=>{const t=w['rating_'+me]??w['likely_to_like_'+me];
    const s=(URG[w.drinkstatus]??0)+(t!=null?(t-3.5)*2.5:0)-(w.drinkstatus==='Over de top'&&t!=null&&t<3.4?2:0);return {w,t,s}}).sort((a,b)=>b.s-a.s);
  if(!ws.length)return'';const off=(S.vOff||0)%Math.max(1,Math.min(ws.length,12));const top=ws.slice(off,off+3);if(top.length<3)top.push(...ws.slice(0,3-top.length));
  const why=x=>x.w.drinkstatus==='Over de top'?'over de top — op = op':x.w.drinkstatus==='Nog net te drinken'?'piek voorbij, drink nu':x.w.drinkstatus.toLowerCase();
  return `<div class="group" style="margin-top:10px"><h2>Vanavond${S.kleur?' · '+S.kleur.toLowerCase():''}</h2><span style="display:flex;gap:6px"><button class="chip" onclick="gerecht()">🍽 bij gerecht</button><button class="chip" onclick="S.vOff=(S.vOff||0)+3;drawKelder()">↻</button></span></div>
  <div class="tonight">${top.map(x=>`<button class="tn" onclick="detail('${x.w.wijn_id}')">${lbl(x.w)}<b>${esc(x.w.producent||x.w.wijnnaam_cuvee)}</b><small>${esc(x.w.producent?x.w.wijnnaam_cuvee:'')} ${x.w.jaargang||''}</small><small>${esc(why(x))}${x.t!=null?` · ${x.w['rating_'+me]!=null?'jouw':'verw.'} ${f1(x.t)}`:''}</small><small>📍 ${esc((x.w.locaties||'').split(',')[0].replace(/ \(\d+\)$/,''))}</small></button>`).join('')}</div>
  <p class="sub" style="margin-bottom:4px">Op volgorde van urgentie en ${S.ik==='Liz'?'Liz\' smaak':'jouw smaak'}. Kies bovenaan een kleur om te filteren.</p>`}
const GERECHT={
 'Rood vlees / BBQ':{k:['Rood'],b:[4,5],t:[3,5],re:'cabernet|syrah|shiraz|malbec|tempranillo|pinotage|zweigelt|blaufr',w:'vol rood met stevige tannine'},
 'Lam':{k:['Rood'],b:[3,5],t:[2,4],re:'cabernet|merlot|bordeaux|rioja|syrah|grenache|rh[oô]ne|ribera',w:'rood met kruidigheid en structuur'},
 'Stoof / wild':{k:['Rood'],b:[4,5],t:[3,5],re:'nebbiolo|barolo|syrah|grenache|amarone|ripasso|bovale|rasteau|nero di troia',w:'krachtig, rijp rood'},
 'Gevogelte':{k:['Rood','Wit'],b:[2,4],t:[1,3],re:'pinot noir|gamay|chardonnay|chenin|fleurie|juli',w:'elegant rood of vol wit'},
 'Varkensvlees':{k:['Rood','Wit','Rosé'],b:[2,4],t:[1,3],re:'pinot|gamay|riesling|pinot gris|grauburg|dolcetto|barbera',w:'soepel rood of rond wit'},
 'Vis (licht)':{k:['Wit','Mousserend'],b:[1,3],z:[3,5],re:'sauvignon|alvarinho|albari|txakol|gr[uü]ner|muscadet|verdejo|godello|riesling',w:'fris, mineraal wit'},
 'Vis (vet) / zalm':{k:['Wit','Rosé','Rood'],b:[3,4],t:[1,2],re:'chardonnay|pinot noir|godello|viognier|chenin|rosé',w:'rond wit, rosé of licht rood'},
 'Schaal- & schelpdieren':{k:['Wit','Mousserend'],b:[1,3],z:[4,5],re:'champagne|cr[eé]mant|sauvignon|txakol|albari|alvarinho|riesling|muscadet|pouilly|sancerre',w:'strak, zilt wit of bubbels'},
 'Pasta tomaat / pizza':{k:['Rood'],b:[2,4],z:[3,5],t:[1,3],re:'barbera|sangiovese|dolcetto|corvina|nero|primitivo|grenache|c[oô]tes du rh',w:'sappig rood met frisse zuren'},
 'Pasta room / paddenstoel':{k:['Wit','Rood'],b:[3,5],t:[1,3],re:'chardonnay|pinot noir|nebbiolo|grauburg|pinot gris|bourgogne',w:'vol wit (hout mag) of elegant rood'},
 'Aziatisch / pittig':{k:['Wit','Rosé','Mousserend'],b:[2,4],t:[1,1],re:'riesling|pinot gris|gew[uü]rz|viognier|torront|gr[uü]ner|grauburg',w:'aromatisch wit met fruit, geen tannine'},
 'Curry / Indiaas':{k:['Wit','Rosé','Rood'],b:[2,4],t:[1,2],re:'pinot gris|viognier|riesling|gamay|ros[eé]|grenache',w:'fruitig, zacht, weinig tannine'},
 'Kaas (zacht / geit)':{k:['Wit','Mousserend'],b:[2,4],re:'sauvignon|sancerre|chenin|chardonnay|champagne|pouilly',w:'fris wit of bubbels'},
 'Kaas (oud / hard)':{k:['Rood','Dessertwijn'],b:[4,5],re:'amarone|ripasso|bordeaux|tokaj|cabernet|nebbiolo',w:'vol rood of zoet'},
 'Dessert':{k:['Dessertwijn','Mousserend'],re:'tokaj|late harvest|passito|moscato',w:'zoete wijn'},
 'Borrel / aperitief':{k:['Mousserend','Wit','Rosé'],b:[1,3],re:'champagne|cr[eé]mant|cava|spumante|ros[eé]|verdejo|sauvignon|gr[uü]ner',w:'licht, fris of bubbels'},
 'Vegetarisch / groenten':{k:['Wit','Rosé','Rood'],b:[2,3],t:[1,2],re:'sauvignon|gr[uü]ner|gamay|pinot|godello|ros[eé]',w:'fris wit, rosé of licht rood'}};
function gerecht(){sheet(`<h2>Wat drinken we bij…</h2><p class="sub">Kies het gerecht; je krijgt de beste kandidaten uit je kelder op basis van stijl, drinkmoment en ${S.ik==='Liz'?'Liz\' smaak':'jouw smaak'}.</p><div class="chips" style="flex-wrap:wrap">${Object.keys(GERECHT).map(g=>`<button class="chip" onclick="gerechtTop('${g.replace(/'/g,"\\'")}')">${g}</button>`).join('')}</div><div id="gtop"></div>`)}
function gerechtTop(g){const r=GERECHT[g],me=S.ik==='Liz'?'liz':'jeroen',re=new RegExp(r.re,'i');
  const fit=(v,rg)=>v==null||!rg?0:(v<rg[0]?rg[0]-v:v>rg[1]?v-rg[1]:0);
  const res=S.kelder.filter(w=>r.k.includes(w.wijnkleur)&&w.drinkstatus!=='Laten liggen').map(w=>{const t=w['rating_'+me]??w['likely_to_like_'+me];
    const hit=re.test([w.druiven,w.regio,w.regionale_stijl,w.wijnnaam_cuvee,w.wijnkleur].join(' '));
    const s=(hit?2.5:0)-1.2*(fit(w.body,r.b)+fit(w.tannines,r.t)+fit(w.zuren,r.z))+(t!=null?(t-3.5)*2:0)+(URG[w.drinkstatus]??0)*.5+(r.k[0]===w.wijnkleur?.5:0);
    return {w,t,s,hit}}).sort((a,b)=>b.s-a.s).slice(0,5);
  $('#gtop').innerHTML=`<div class="group"><h2>${esc(g)}</h2></div><p class="sub" style="margin-bottom:8px">Zoek naar: ${r.w}.</p><div class="list">${res.map(o=>card(o.w,`${o.hit?'<span class="tag best">klassieke combinatie</span> ':''}${stag(o.w.drinkstatus)}<br><span class="muted">📍 ${esc((o.w.locaties||'').split(',')[0].replace(/ \(\d+\)$/,''))}</span>`)).join('')||'<div class="empty-state">Niets passends in je kelder</div>'}</div>`;
  $('#gtop').scrollIntoView({behavior:'smooth'})}
function todoBox(){const nv=nVerplaats(),nc=S.kelder.filter(w=>issues(w).length).length,today=new Date().toISOString().slice(0,10);
  if((!nv&&!nc)||ls.get('todo_hide','')===today+':'+nv+':'+nc)return'';
  return `<div class="sec" style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 12px;margin:4px 0 8px;position:relative;padding-right:46px"><b style="font-size:14px;white-space:nowrap">Te doen</b>
  ${nv?`<button class="chip" onclick="S.groep=S.kv?.length?'kaart':'verplaats';drawKelder();scrollTo(0,0)">↔ ${nv} naar andere zone</button>`:''}
  ${nc?`<button class="chip" onclick="S.groep='check';drawKelder();scrollTo(0,0)">⚠ ${nc} controleren</button>`:''}
  <button class="x" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);margin:0;width:30px;height:30px;font-size:14px" aria-label="Verbergen" onclick="ls.set('todo_hide','${today}:${nv}:${nc}');this.parentNode.remove()">✕</button></div>`}
function terug(t){return `<button class="chip" style="margin:6px 0 4px" onclick="S.groep=ls.get('groep','zone');if(['check','verplaats','kaart'].includes(S.groep))S.groep='zone';render()">← Terug naar kelder</button><h2 style="font-size:20px;margin:6px 0 4px">${t}</h2>`}
function zoneReden(w){const z=w.zone_advies,id=w.zone_ideaal,f=(w.drinkstatus||'').toLowerCase();
  if(w.bewaarzone_advies)return 'eigen keuze';
  const vol=id&&id!==z?` (ideaal is ${id}, maar die zone is vol; wat eerder op moet of duurder is gaat voor)`:'';
  if(w.bewaarwijn&&z!=='18°C')return `dure bewaarwijn (${f}): achterin de ${z}-zone laten rijpen`;
  if(w.wijnkleur==='Rood'){if(z==='16°C')return /over|nog net/.test(f)?'moet binnenkort op: op drinktemperatuur klaarleggen':`${f}: op drinktemperatuur klaarleggen`;
    return 'rood voor de komende maanden; 18°C is prima en de kast blijft vrij voor wat eerder op moet'+vol}
  if(z==='10°C')return (w.wijnkleur==='Mousserend'?'Champagne / kwaliteitsbubbels':w.wijnkleur==='Rosé'?'droge Provence-rosé':w.wijnkleur==='Wit'?'vol of rond wit':'deze stijl')+' schenk je op ±10°C'+vol;
  return (w.wijnkleur==='Mousserend'?'eenvoudige bubbels':w.wijnkleur==='Rosé'?'lichte, fruitige rosé':'fris wit')+': koud schenken op ±8°C'+vol}
function drawVerplaats(ws){
  const W=Object.fromEntries(ws.map(w=>[w.wijn_id,w]));const occ={},after={};
  S.vakken.forEach(v=>{occ[v.zone]=(occ[v.zone]||0)+v.aantal});Object.assign(after,occ);
  const mv=S.vakken.filter(v=>W[v.wijn_id]&&W[v.wijn_id].zone_advies&&W[v.wijn_id].zone_advies!==v.zone).map(v=>({v,w:W[v.wijn_id]}));
  mv.forEach(m=>{after[m.v.zone]-=m.v.aantal;after[m.w.zone_advies]=(after[m.w.zone_advies]||0)+m.v.aantal});
  if(!mv.length) return $('#main').innerHTML=terug('Verplaatsen')+'<div class="empty-state"><h3>Alles ligt goed</h3>Elke fles ligt in de geadviseerde zone.</div>';
  const occRow=ZONES.map(z=>{const c=S.cap?.[z],o=after[z]||0;return `<div class="srow"><span>${ZNAAM[z]}</span><span style="color:${c&&o>c?'var(--bad)':'inherit'}">nu ${occ[z]||0} → na advies ${o}${c?' / '+c:''}</span></div>`}).join('');
  const by={};mv.forEach(m=>(by[m.w.zone_advies]=by[m.w.zone_advies]||[]).push(m));
  $('#main').innerHTML=terug('Verplaatsen')+`<div class="sec"><h3>Bezetting per zone</h3>${occRow}<p class="sub" style="margin-top:6px">Rood = past niet. Begin dan bovenaan de lijst: wat het dichtst bij zijn piek of eroverheen is, gaat voor.</p></div>`+
  ZONES.filter(z=>by[z]).map(z=>`<div class="group"><h2>Naar ${ZNAAM[z]}</h2><span>${by[z].reduce((a,m)=>a+m.v.aantal,0)} fl.</span></div><div class="list">${by[z].sort((a,b)=>(PRIO[a.w.drinkstatus]??9)-(PRIO[b.w.drinkstatus]??9)).map(m=>card(m.w,`<span class="cnt">${m.v.aantal}×</span> nu: ${esc(m.v.zone)}${m.v.vak?' · '+esc(m.v.vak):''} ${stag(m.w.drinkstatus)}`)).join('')}</div>`).join('');
}

/* ---------- kelderkaart (B5) ---------- */
const FS=w=>/over de top|nog net/i.test(w.drinkstatus||'')?'eerst':(w.bewaarwijn||/bijna|laten/i.test(w.drinkstatus||''))?'bewaar':'nu';
const FASEN={eerst:'eerst op',nu:'nu drinken',bewaar:'bewaren'};
const reCache={};const kre=p=>{try{return reCache[p]??=new RegExp(p,'i')}catch(e){return /$^/}};
const OPENVAK=w=>w.wijnkleur==='Rood'?'16°C-T':'10°C-B';
const ZONDERPOS=new Set(['18°C-H','18°C-D']);
const plek=(k,pos)=>ZONDERPOS.has(k.vak_id)?k.naam:k.naam+' · '+pos;
const inVak=(vak,k)=>vak===k.naam||(vak||'').startsWith(k.naam+' · ');
function kastPlan(){const KV=S.kv||[];if(!KV.length)return null;
  const W=Object.fromEntries(S.kelder.map(w=>[w.wijn_id,w])),KI=Object.fromEntries(KV.map(k=>[k.vak_id,k]));
  const openN={},openM={};(S.open||[]).forEach(o=>{openN[o.wijn_id]=(openN[o.wijn_id]||0)+1;openM[o.wijn_id]=o.methode});const Y=new Date().getFullYear();
  const units=[];S.vakken.forEach(v=>{const w=W[v.wijn_id];if(w)for(let i=0;i<v.aantal;i++)units.push({w,cz:v.zone,cv:v.vak||''})});
  const ord={bewaar:0,eerst:1,nu:2};
  // volgorde van inruimen: open flessen (vaste plek), dan bewaarwijn (houdt zijn plek achterin de juiste lade), dan eerst op, dan nu drinken; duurdere fles gaat voor
  units.forEach(u=>{u.f=FS(u.w);u.f2=u.f==='bewaar'?((u.w.beste_drinkmoment_vanaf||u.w.drinkvenster_vanaf_jaar||Y+3)<=Y+2?'bewaar-kort':'bewaar-lang'):u.f;u.open=false});
  const inOV=u=>{const k=KI[OPENVAK(u.w)];return k&&u.cz===k.zone&&inVak(u.cv,k)};
  [true,false].forEach(eerst=>units.forEach(u=>{if(!u.open&&openN[u.w.wijn_id]>0&&(!eerst||inOV(u))){u.open=true;openN[u.w.wijn_id]--}}));
  units.sort((a,b)=>(b.open-a.open)||ord[a.f]-ord[b.f]||(PRIO[a.w.drinkstatus]??3)-(PRIO[b.w.drinkstatus]??3)||(b.w.prijs||0)-(a.w.prijs||0)||a.w.wijn_id.localeCompare(b.w.wijn_id));
  const vrij=Object.fromEntries(KV.map(k=>[k.vak_id,k.capaciteit])),gezet=new Set(),inZone={};
  for(const u of units){
    let k=null;
    if(u.open)k=KI[OPENVAK(u.w)];
    if(!k){const z=u.w.zone_advies||u.cz,t=[u.w.wijnkleur,u.w.stijlfamilie,u.w.druiven,u.w.regio,u.w.land,u.w.wijnnaam_cuvee,u.w.regionale_stijl].join(' ').toLowerCase();
      const fz=a=>!a?0:a===u.f2||a===u.f?2:(a==='eerst'&&u.f==='nu'||a==='nu'&&u.f==='eerst')?1:a.startsWith('bewaar')&&u.f==='bewaar'?1:-2;
      const nz=inZone[z+'|'+u.w.wijn_id]||0,inH=gezet.has('18°C-H|'+u.w.wijn_id);
      // 18°C: één fles per wijn in de honingraat, de rest ernaast; 8°C: derde fles en verder naar de bodem (reserve)
      let c=KV.filter(x=>x.zone===z).map(x=>({x,ok:!x.categorie||kre(x.categorie).test(t),s:(x.categorie?4:0)+fz(x.fase)-(x.vak_id==='18°C-H'&&inH?3:0)+(x.vak_id==='18°C-O'&&inH?3:0)+(x.vak_id==='8°C-B'&&nz>=2?6:0)}));
      c.sort((a,b)=>b.ok-a.ok||b.s-a.s||vrij[b.x.vak_id]-vrij[a.x.vak_id]);
      // eerst een passende lade met ruimte, anders een andere lade in dezelfde zone met ruimte, anders (te vol) de best passende
      k=(c.find(y=>y.ok&&vrij[y.x.vak_id]>0)||c.find(y=>vrij[y.x.vak_id]>0)||c[0])?.x;}
    if(!k)continue;
    const al=gezet.has(k.vak_id+'|'+u.w.wijn_id);
    u.k=k;vrij[k.vak_id]--;gezet.add(k.vak_id+'|'+u.w.wijn_id);inZone[k.zone+'|'+u.w.wijn_id]=(inZone[k.zone+'|'+u.w.wijn_id]||0)+1;
    // voorin één fles per wijn (eerst op bovenaan); achterin bewaarwijn, tweede flessen en Coravin-flessen
    u.pos=u.open?(openM[u.w.wijn_id]==='Coravin'?'achter':'voor'):u.f==='bewaar'||al?'achter':'voor'}
  // bewaarplanken (kelder): voorin wat het eerst op dronk komt, achterin de rest
  KV.filter(k=>(k.fase||'').startsWith('bewaar')).forEach(k=>{const us=units.filter(u=>u.k===k).sort((a,b)=>(a.w.beste_drinkmoment_vanaf||9999)-(b.w.beste_drinkmoment_vanaf||9999));us.forEach((u,i)=>u.pos=i<Math.ceil(us.length/2)?'voor':'achter')});
  units.forEach(u=>{if(u.k){u.doel=plek(u.k,u.pos);u.hier=u.cz===u.k.zone&&u.cv===u.doel}});
  return {units:units.filter(u=>u.k),KV,vrij}}
function kchips(us){const m=new Map();us.forEach(u=>{const key=u.w.wijn_id+'|'+(u.hier?'':u.cz+u.cv);if(!m.has(key))m.set(key,{u,n:0});m.get(key).n++});
  return [...m.values()].map(({u,n})=>`<button class="kc s-${u.f}${u.hier?'':' mv'}" onclick="detail('${u.w.wijn_id}')">${n>1?n+'× ':''}${u.open?'🫗 ':''}${esc(u.w.producent||u.w.wijnnaam_cuvee)} ${u.w.jaargang?"'"+String(u.w.jaargang).slice(2):''}${u.hier?'':`<i>↘ nu ${esc(u.cz)}${u.cv?' · '+esc(u.cv):''}</i>`}</button>`).join('')}
function drawKaart(){const P=kastPlan();
  if(!P)return $('#main').innerHTML=terug('Kelderkaart')+'<div class="empty-state"><h3>Nog geen lade-indeling</h3>Draai eerst de SQL-bestanden 19 en 22 in Supabase.</div>';
  const nmv=P.units.filter(u=>!u.hier).length,mode=S.kmode||'lade';
  let h=terug('Kelderkaart')+`<p class="sub">Zo ligt alles het handigst: per zone de juiste temperatuur, per lade één stijl (🏷 label), <b>voorin</b> één fles per wijn met wat eerst op moet vooraan, <b>achterin</b> de bewaarwijn en tweede flessen. Kleur: <span style="color:var(--bad)">■</span> eerst op · <span style="color:var(--ok)">■</span> nu drinken · <span style="color:var(--pred)">■</span> bewaren. Gestippeld = ligt nog ergens anders.</p>
  <div class="chips" style="margin:8px 0"><button class="chip ${mode==='lade'?'on':''}" onclick="S.kmode='lade';drawKaart()">Per lade (zo moet het)</button><button class="chip ${mode==='uit'?'on':''}" onclick="S.kmode='uit';drawKaart()">Uitpakken (waar ligt het nu)</button></div>
  ${nmv?`<p class="sub"><b>${nmv} flessen</b> liggen nog niet op hun plek. Richt een lade in volgens de kaart en tik op <b>✓ Lade ingericht</b>; dan worden de verplaatsingen in één keer vastgelegd.</p>`:'<p class="sub" style="color:var(--ok)">✓ Alles ligt op zijn plek.</p>'}`;
  if(mode==='uit'){const by={};P.units.filter(u=>!u.hier).forEach(u=>(by[u.cz+' · '+(u.cv||'—')]=by[u.cz+' · '+(u.cv||'—')]||[]).push(u));
    h+=Object.keys(by).sort((a,b)=>ZONES.indexOf(by[a][0].cz)-ZONES.indexOf(by[b][0].cz)||a.localeCompare(b,'nl',{numeric:true})).map(k=>{const m=new Map();by[k].forEach(u=>{const key=u.w.wijn_id+'|'+u.k.vak_id+u.pos;if(!m.has(key))m.set(key,{u,n:0});m.get(key).n++});
      return `<div class="lade"><h4>Uit ${esc(k)}<small>${by[k].length} fl.</small></h4>${[...m.values()].map(({u,n})=>`<div class="srow" style="cursor:pointer" onclick="detail('${u.w.wijn_id}')"><span>${n>1?n+'× ':''}${esc(naam(u.w))} ${u.w.jaargang||''}</span><span class="muted" style="text-align:right">→ ${esc(u.k.zone)} · ${esc(u.doel)}</span></div>`).join('')}</div>`}).join('');
    return $('#main').innerHTML=h}
  for(const z of ['16°C','10°C','8°C','18°C']){const ks=P.KV.filter(k=>k.zone===z).sort((a,b)=>b.volgorde-a.volgorde);if(!ks.length)continue;
    const nz=P.units.filter(u=>u.k.zone===z).length,cz=ks.reduce((a,k)=>a+k.capaciteit,0);
    h+=`<div class="zkop"><h2>${esc(ZNAAM[z])}</h2><span class="muted">${nz} / ${cz}</span></div>`;
    h+=ks.map(k=>{const us=P.units.filter(u=>u.k.vak_id===k.vak_id),voor=us.filter(u=>u.pos==='voor'),acht=us.filter(u=>u.pos==='achter').sort((a,b)=>(a.w.beste_drinkmoment_vanaf||9999)-(b.w.beste_drinkmoment_vanaf||9999));
      const mv=us.filter(u=>!u.hier).length,vol=us.length>k.capaciteit;
      return `<div class="lade"><h4>${esc(k.naam)}<small>${us.length} / ${k.capaciteit}${vol?' · <b style="color:var(--bad)">te vol</b>':''}</small></h4><div class="lab">${k.label?`🏷 <b>${esc(k.label)}</b>${k.label_achter?' · achter: '+esc(k.label_achter):''}`:'zonder label — '+esc((k.functie||'').replace(/^Geen label: /,''))}</div><div class="fill ${vol?'vol':''}"><span style="width:${Math.min(100,us.length/k.capaciteit*100)}%"></span></div>
      ${voor.length?`<div class="pos">Voorin${k.label?' · '+esc(k.label):''} — eerst op vooraan</div>${kchips(voor)}`:''}${acht.length?`<div class="pos">Achterin${k.label_achter?' · '+esc(k.label_achter):''}</div>${kchips(acht)}`:''}${!us.length?'<p class="muted" style="font-size:13px">Leeg</p>':''}
      ${mv?`<button class="btn sm" style="margin-top:8px" onclick="ladeKlaar('${k.vak_id}',this)">✓ Lade ingericht · ${mv} verplaatsing${mv>1?'en':''} vastleggen</button>`:''}</div>`}).join('')}
  $('#main').innerHTML=h}
async function ladeKlaar(id,btn){const P=kastPlan(),g={};
  P.units.filter(u=>u.k.vak_id===id&&!u.hier).forEach(u=>{const key=u.w.wijn_id+'|'+u.cz+'|'+u.cv+'|'+u.doel;(g[key]=g[key]||{u,n:0}).n++});
  btn.disabled=true;btn.textContent='Vastleggen…';
  try{for(const {u,n} of Object.values(g))await q(sb.rpc('fles_verplaatsen',{p_wijn:u.w.wijn_id,p_van_zone:u.cz,p_van_vak:u.cv,p_naar_zone:u.k.zone,p_naar_vak:u.doel,p_aantal:n,p_door:S.ik}));
    toast('Lade vastgelegd');S.kelder=null;await kelderView()}catch(e){btn.disabled=false;btn.textContent='Opnieuw proberen'}}

/* ---------- open flessen / Coravin (B13) ---------- */
function houdbaar(w,o){const port=/port|banyuls|maury|madeira|sherry|marsala/i.test([w.regio,w.wijnnaam_cuvee,w.regionale_stijl].join(' '));
  if(o.methode==='Coravin')return w.wijnkleur==='Mousserend'?2:port?365:90;
  return port?30:w.wijnkleur==='Dessertwijn'?14:w.wijnkleur==='Mousserend'?2:w.wijnkleur==='Rood'?((w.body||3)>=4||(w.tannines||2)>=4?5:3):4}
function openInfo(w,o){const d=Math.floor((Date.now()-new Date(o.geopend_op))/864e5),h=houdbaar(w,o),rest=h-d;
  const kl=rest<0?'var(--bad)':rest<=1?'var(--warn)':'var(--ok)';
  const txt=o.methode==='Coravin'?(rest<0?'al lang aangeprikt: eerst even proeven':rest>60?'blijft nog maanden goed':`nog ±${Math.round(rest/7)||1} weken goed`):(rest<0?'waarschijnlijk over zijn best':rest===0?'vandaag opmaken':`nog ±${rest} dag${rest>1?'en':''} goed`);
  return {d,txt,kl,lbl:`${o.methode==='Coravin'?'Coravin':'kurk eruit'} · ${d?d+' dag'+(d>1?'en':'')+' geleden':'vandaag'} · ${o.glazen} gla${o.glazen>1?'zen':'s'}`}}
function openBlok(){const os=S.open||[];if(!os.length)return'';const W=Object.fromEntries(S.kelder.map(w=>[w.wijn_id,w]));
  return `<div class="sec" style="padding:10px 12px;margin:4px 0 8px"><b style="font-size:14px">🫗 Open flessen</b>${os.map(o=>{const w=W[o.wijn_id];if(!w)return'';const i=openInfo(w,o);
    return `<div class="ofl" onclick="detail('${w.wijn_id}')"><span>${esc(naam(w))} ${w.jaargang||''}<br><span class="muted" style="font-size:12px">${esc(i.lbl)}</span></span><span style="color:${i.kl};font-size:13px;text-align:right">${esc(i.txt)}</span></div>`}).join('')}</div>`}
function openSectie(w){const o=(S.open||[]).find(x=>x.wijn_id===w.wijn_id);if(!o)return'';const i=openInfo(w,o);
  return `<div class="sec"><h3>🫗 Open fles</h3><p class="sub">${esc(i.lbl)} · <b style="color:${i.kl}">${esc(i.txt)}</b>${o.methode==='Coravin'&&w.wijnkleur==='Mousserend'?' · Coravin is niet geschikt voor bubbels (behalve Coravin Sparkling)':''}</p>
  <div class="row" style="margin-top:8px"><button class="btn sm sec2" style="flex:1" onclick="glasErbij(${o.open_id},${o.glazen})">+1 glas</button><button class="btn sm" style="flex:1" onclick="flesLeeg(${o.open_id})">Fles leeg · afboeken</button></div></div>`}
function openFlow(){const w=S.cur.w;let m='Coravin';
  sheet(`<h2>Fles openen</h2><p class="sub">${esc(naam(w))} ${w.jaargang||''}</p>
  <label class="f">Hoe?</label><div class="seg" id="om"><button data-m="Coravin" class="on">Coravin (kurk blijft erin)</button><button data-m="Kurk">Kurk eruit</button></div>
  <p class="sub" id="oh" style="margin-top:6px"></p>
  <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" id="omv" checked> Leg hem in het vak open flessen (${w.wijnkleur==='Rood'?'rood: 16°C toonvak':'wit/rosé/bubbels: 10°C bodem'})</label>
  <button class="btn full" id="go" style="margin-top:14px">Openen · eerste glas</button>`);
  const hint=()=>{const h=houdbaar(w,{methode:m});$('#oh').textContent=m==='Coravin'?(w.wijnkleur==='Mousserend'?'Let op: een gewone Coravin werkt niet bij bubbels.':`Blijft ${h>=365?'een jaar of langer':'maanden'} goed; de fles blijft gewoon in de voorraad tot hij leeg is.`):`Daarna nog ±${h} dag${h>1?'en':''} goed (koel en dicht bewaren).`};hint();
  $('#om').onclick=e=>{if(e.target.dataset.m){m=e.target.dataset.m;$('#om').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target));hint()}};
  $('#go').onclick=async e=>{e.target.disabled=true;
    try{await q(sb.from('open_flessen').insert({wijn_id:w.wijn_id,methode:m,door:S.ik}));
      const k=(S.kv||[]).find(x=>x.vak_id===OPENVAK(w));
      if($('#omv').checked&&k&&!S.cur.vak.some(v=>v.zone===k.zone&&inVak(v.vak,k))){const v=S.cur.vak[0];
        await q(sb.rpc('fles_verplaatsen',{p_wijn:w.wijn_id,p_van_zone:v.zone,p_van_vak:v.vak||'',p_naar_zone:k.zone,p_naar_vak:plek(k,m==='Coravin'&&k.vak_id==='16°C-T'?'achter':'voor'),p_aantal:1,p_door:S.ik}))}
      toast('Geopend — proost!');invalidate();await kelderView();detail(w.wijn_id)}catch(err){e.target.disabled=false}}}
async function glasErbij(id,n){await q(sb.from('open_flessen').update({glazen:n+1,laatst_glas:new Date().toISOString()}).eq('open_id',id));const w=S.cur.w;invalidate();await kelderView();detail(w.wijn_id)}
async function flesLeeg(id){await q(sb.from('open_flessen').update({leeg_op:new Date().toISOString()}).eq('open_id',id));S.open=(S.open||[]).filter(o=>o.open_id!==id);
  const w=S.cur.w,k=(S.kv||[]).find(x=>x.vak_id===OPENVAK(w)),i=Math.max(0,S.cur.vak.findIndex(v=>k&&v.zone===k.zone&&inVak(v.vak,k)));
  if(S.cur.vak.length)drinkFlow(i);else toast('Afgesloten')}

/* ---------- geproefd ---------- */
async function geproefdView(){
  $('#hsub').innerHTML=filterbar('Zoek in geproefde wijnen…',`<div class="chips">${[['gedronken','Gedronken'],['rating','Hoogste eerst'],['laag','Laagste eerst'],['naam','Naam'],['liz','Liz']].map(([k,l])=>`<button class="chip ${S.sort===k?'on':''}" onclick="S.sort='${k}';render()">${l}</button>`).join('')}</div>`);
  if(S.sort==='gedronken') return gedronkenView();
  if(!S.geproefd) S.geproefd=await q(sb.from('wijn_overzicht').select(COLS).or('aantal_ratings_jeroen.gt.0,aantal_ratings_liz.gt.0').limit(5000));
  drawGeproefd();
}
async function gedronkenView(){
  const W='wijn_id,producent,wijnnaam_cuvee,jaargang,wijnkleur,regio,land,etiketfoto_url,flesfoto_url';
  if(!S.gedronken){
    const [dm,km]=await Promise.all([
      q(sb.from('drinkmomenten').select(`drinkmoment_id,datum,gelegenheid,gerecht,wijnen(${W}),proefnotities(persoon,eigen_rating,eigen_proefnotitie)`).order('datum',{ascending:false}).limit(300)),
      q(sb.from('voorraadmutaties').select(`datumtijd,reden,toelichting,wijnen(${W})`).in('reden',['Kapot','Weggegeven']).eq('testgegeven',false).order('datumtijd',{ascending:false}).limit(100))]);
    S.gedronken=[...dm.map(d=>({d:d.datum,w:d.wijnen,r:d.proefnotities||[],x:[d.gelegenheid,d.gerecht].filter(Boolean).join(' · ')})),
      ...km.map(m=>({d:m.datumtijd.slice(0,10),w:m.wijnen,r:[],x:(m.reden==='Kapot'?'✗ Bedorven / weggegooid':'Weggegeven')+(m.toelichting?' — '+m.toelichting:'')}))].filter(i=>i.w).sort((a,b)=>b.d.localeCompare(a.d));
  }
  const it=S.gedronken.filter(i=>match(i.w));
  if(!it.length) return $('#main').innerHTML='<div class="empty-state"><h3>Nog niets gedronken</h3>Tik bij een wijn in je kelder op <b>Drinken</b>; de fles verschijnt dan hier.</div>';
  let last='';
  $('#main').innerHTML=`<p class="sub">${it.length} flessen</p>`+it.map(i=>{
    const mo=new Date(i.d).toLocaleDateString('nl-NL',{month:'long',year:'numeric'});
    const h=mo!==last?`<div class="group"><h2>${mo}</h2></div>`:'';last=mo;
    const rj=i.r.find(r=>r.persoon==='Jeroen'),rl=i.r.find(r=>r.persoon==='Liz');
    const w={...i.w,rating_jeroen:rj?.eigen_rating??null,rating_liz:rl?.eigen_rating??null};
    return h+`<div class="list" style="margin-bottom:10px">${card(w,`${new Date(i.d).toLocaleDateString('nl-NL',{day:'numeric',month:'short'})}${i.x?' · '+esc(i.x):''}`)}</div>`}).join('');
}
function drawGeproefd(){
  const me=S.sort==='liz'?'rating_liz':S.ik==='Liz'?'rating_liz':'rating_jeroen';
  let ws=S.geproefd.filter(match); if(S.sort==='liz') ws=ws.filter(w=>w.rating_liz!=null);
  ws.sort(S.sort==='naam'?(a,b)=>naam(a).localeCompare(naam(b)):S.sort==='laag'?(a,b)=>(a[me]??9)-(b[me]??9):(a,b)=>(b[me]??-1)-(a[me]??-1));
  const cls=cluster(ws.map(w=>({w,n:w.voorraad})));
  const best=c=>Math.max(...c.map(i=>i.w[me]??-1)),worst=c=>Math.min(...c.map(i=>i.w[me]??9));
  if(S.sort==='naam')cls.sort((a,b)=>naam(a[0].w).localeCompare(naam(b[0].w)));else if(S.sort==='laag')cls.sort((a,b)=>worst(a)-worst(b));else cls.sort((a,b)=>best(b)-best(a));
  $('#main').innerHTML=`<p class="sub">${ws.length} wijnen · ${cls.length} unieke</p><div class="list" style="margin-top:8px">${cls.map(c=>gcard(c,'rating')||card(c[0].w,c[0].w.voorraad?`<span class="cnt">${c[0].w.voorraad}× in kelder</span>`:'')).join('')||'<div class="empty-state">Niets gevonden</div>'}</div>`;
}

async function bijkopen(){

  const op=cl.filter(c=>c.every(i=>!i.w.voorraad)),bijna=cl.filter(c=>c.reduce((a,i)=>a+(i.w.voorraad||0),0)===1);

  S.bijkoopTekst='Bijkooplijst wijn\n'+op.slice(0,40).map(c=>'- '+line(c)).join('\n');

  <button class="btn sec2 full" style="margin:8px 0" onclick="navigator.clipboard.writeText(S.bijkoopTekst).then(()=>toast('Lijst gekopieerd'),()=>sheet('<textarea class=inp style=min-height:50vh>'+esc(S.bijkoopTekst)+'</textarea>'))">📋 Kopieer lijst voor de wijnhandel</button>
  ${bijna.length?`<div class="group"><h2>Bijna op</h2><span>nog 1 fles</span></div><div class="list">${bijna.map(c=>card(c[0].w,'<span class="cnt">nog 1×</span>')).join('')}</div>`:''}
  <div class="group"><h2>Op — opnieuw kopen?</h2><span>${op.length}</span></div><div class="list">${op.map(c=>gcard(c,'rating')||card(c[0].w,ids.has(c[0].w.wijn_id)?'<span class="tag best">opnieuw kopen: ja</span>':'')).join('')||'<div class="empty-state">Niets gevonden</div>'}</div>`}
async function ontdekSearch(){
  let p=sb.from('wijn_overzicht').select(COLS);
  const t=S.q.trim().replace(/[,()%]/g,' ');
  if(t) t.split(/\s+/).filter(Boolean).forEach(x=>{const L=NLLAND[norm(x)];const y=ilk(x);p=/^\d{4}$/.test(x)?p.eq('jaargang',+x):p.or(`producent.ilike.%${y}%,wijnnaam_cuvee.ilike.%${y}%,regio.ilike.%${y}%,regionale_stijl.ilike.%${y}%,land.ilike.%${L||y}%,druiven.ilike.%${y}%`)});
  if(S.kleur) p=p.eq('wijnkleur',S.kleur);
  const col=S.ik==='Liz'?'likely_to_like_liz':'likely_to_like_jeroen';
  const ws=await q(p.order(col,{ascending:false,nullsFirst:false}).limit(60));

}

  ${EF.map(([k,l])=>`<label class="f">${l}</label><input class="inp" id="e_${k}" value="${esc(w[k]??'')}" ${k==='jaargang'?'inputmode="numeric"':''}>`).join('')}

  $('#e_k').onclick=e=>{if(e.target.tagName==='BUTTON')$('#e_k').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target))};

    v.wijnkleur=$('#e_k .on')?.textContent||w.wijnkleur;

    if(issues(w).length||/te controleren/i.test(w.validatiestatus||''))v.validatiestatus='Gecontroleerd';
    e.target.disabled=true;
    try{
      // Andere jaargang bij een wijn met beoordelingen: oude jaargang intact laten, nieuwe aanmaken en voorraad overzetten
      if(v.jaargang!==w.jaargang&&(w.aantal_ratings_jeroen||w.aantal_ratings_liz)&&confirm(`Deze wijn heeft beoordelingen van jaargang ${w.jaargang||'onbekend'}. Wil je jaargang ${v.jaargang||'onbekend'} als aparte wijn aanmaken en de flessen in de kelder daarheen overzetten?`)){
        const base=Object.fromEntries(['producent','wijnnaam_cuvee','wijnkleur','land','regio','regionale_stijl','druiven','etiketfoto_url','vivino_url'].map(k=>[k,w[k]]));
        const [nw]=await q(sb.from('wijnen').insert({...base,...v,wijngegevens_bron:'App',validatiestatus:'Nieuwe jaargang van '+w.wijn_id}).select());
        const r=crypto.randomUUID?crypto.randomUUID():null;
        const m=S.cur.vak.flatMap(x=>[{wijn_id:w.wijn_id,aantal_delta:-x.aantal,reden:'Correctie',zone:x.zone,vak:x.vak||'',referentie_id:r,verwerkt_door:S.ik,toelichting:'Jaargang gecorrigeerd'},{wijn_id:nw.wijn_id,aantal_delta:x.aantal,reden:'Correctie',zone:x.zone,vak:x.vak||'',referentie_id:r,verwerkt_door:S.ik,toelichting:'Jaargang gecorrigeerd'}]);
        if(m.length)await q(sb.from('voorraadmutaties').insert(m));
        toast('Nieuwe jaargang aangemaakt');invalidate();render();return detail(nw.wijn_id);
      }
      await q(sb.from('wijnen').update(v).eq('wijn_id',w.wijn_id));
      toast('Opgeslagen');invalidate();render();detail(w.wijn_id);
    }catch(err){e.target.disabled=false}};
}
async function lijktOp(w){const el=$('#lijkt');if(!el)return;
  const qv=x=>'"'+String(x).replace(/"/g,'')+'"';const ors=[];
  if(w.regionale_stijl)ors.push(`regionale_stijl.eq.${qv(w.regionale_stijl)}`);if(w.stijlfamilie)ors.push(`stijlfamilie.eq.${qv(w.stijlfamilie)}`);
  const g=(w.druiven||'').split(/[,(]/)[0].trim();if(g.length>3)ors.push(`druiven.ilike.${qv('%'+ilk(g)+'%')}`);if(w.regio)ors.push(`regio.ilike.${qv('%'+ilk(w.regio.split(' – ')[0])+'%')}`);
  if(!ors.length)return;
  let c;try{c=await q(sb.from('wijn_overzicht').select(COLS).eq('wijnkleur',w.wijnkleur).or(ors.join(',')).limit(400))}catch(e){return}
  const k0=wkey(w),ng=norm(g),nr=norm((w.regio||'').split(' – ')[0]);
  const sc=c.filter(x=>wkey(x)!==k0).map(x=>{let s=0,why=[];
    if(w.regionale_stijl&&x.regionale_stijl===w.regionale_stijl){s+=4;why.push('zelfde stijl')}
    if(w.stijlfamilie&&x.stijlfamilie===w.stijlfamilie){s+=3;if(!why.length)why.push(x.stijlfamilie.toLowerCase())}
    if(ng&&norm(x.druiven||x.regionale_stijl||'').includes(ng)){s+=2;why.push(g)}
    if(nr&&norm(x.regio||'').includes(nr)){s+=1.5;why.push(x.regio.split(' – ')[0])}
    if(x.land&&x.land===w.land)s+=.5;
    ['body','zuren','tannines','fruit'].forEach(f=>{if(w[f]!=null&&x[f]!=null)s-=.6*Math.abs(w[f]-x[f])});
    return {x,s,why:[...new Set(why)].slice(0,2).join(' · ')}}).filter(o=>o.s>=3).sort((a,b)=>b.s-a.s);
  const me=S.ik==='Liz'?'rating_liz':'rating_jeroen';
  const gep=sc.filter(o=>o.x[me]!=null).slice(0,4),keld=sc.filter(o=>o.x.voorraad>0&&!gep.includes(o)).slice(0,3);
  if(!keld.length&&!gep.length)return;
  const allr=sc.filter(o=>o.x[me]!=null).slice(0,12).map(o=>+o.x[me]);const avg=allr.length?allr.reduce((a,b)=>a+b,0)/allr.length:null;
  const row=o=>`<div class="vrow" onclick="detail('${o.x.wijn_id}')"><span>${esc(naam(o.x))} ${o.x.jaargang||''}<br><span class="muted" style="font-size:12px">${esc(o.why)}${o.x.voorraad?` · ${o.x.voorraad}× in kelder`:''}</span></span><span>${o.x[me]!=null?f1(o.x[me]):o.x.vivino_gemiddelde?'<span class="muted">V '+f1(o.x.vivino_gemiddelde)+'</span>':''}</span></div>`;
  el.innerHTML=`<div class="sec"><h3>Lijkt op…</h3>${avg!=null?`<p class="sub" style="margin-bottom:6px">Vergelijkbare wijnen gaf ${S.ik==='Liz'?'Liz':'je'} gemiddeld <b>${avg.toFixed(1).replace('.',',')}</b> (${allr.length}×).</p>`:''}
  ${gep.length?`<p class="sub"><b>Eerder geproefd</b></p>${gep.map(row).join('')}`:''}${keld.length?`<p class="sub" style="margin-top:8px"><b>Ook in je kelder</b></p>${keld.map(row).join('')}`:''}</div>`}

async function uploadFoto(f){if(!f)return;const w=S.cur.w;toast('Foto uploaden…');
  try{const img=await createImageBitmap(f);const k=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));const path=`${w.wijn_id}-${Date.now()}.jpg`;
    const {error}=await sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
    const url=sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
    await q(sb.from('wijnen').update({flesfoto_url:url}).eq('wijn_id',w.wijn_id));toast('Foto opgeslagen');invalidate();render();detail(w.wijn_id)}
  catch(e){console.error(e);toast('Uploaden mislukt: '+(e.message||e),1)}}

async function fotoNaarBase64(f,max){const img=await createImageBitmap(f);const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(blob)});return {b64,blob}}
async function scan(f,modus){if(!f)return;
  sheet(`<div class="empty-state"><h3>${modus==='pakbon'?'Claude leest de bon…':'Claude leest de etiketten…'}</h3>Dit duurt meestal 5–15 seconden.</div>`);
  try{const {b64,blob}=await fotoNaarBase64(f,modus==='pakbon'?2000:1600);
    const {data,error}=await sb.functions.invoke('scan-etiket',{body:{image:b64,mime:'image/jpeg',modus}});
    if(error){let msg=error.message;try{const st=error.context?.status;const b=await error.context.json();msg=(b.fout||b.msg||b.message||b.error||msg)+(st?` (status ${st})`:'')}catch(e){try{msg+=' (status '+error.context.status+')'}catch(_){}}throw new Error(msg)}
    if(data?.fout)throw new Error(data.fout);
    const items=(data.flessen||[]).map(x=>({...x,aantal:Math.max(1,+x.aantal||1),keuze:'nieuw',kand:[]}));
    if(!items.length){closeSheet();return toast('Geen wijn herkend op deze foto',1)}
    S.scan={modus,items,leverancier:data.leverancier||'',datum:data.datum||null,blob,onleesbaar:data.onleesbaar||0,herkomst:modus==='pakbon'?'Aankoop':'Inventarisatie',vak:''};
    await Promise.all(items.map(matchScan));renderScan();
  }catch(e){console.error(e);closeSheet();toast('Scannen mislukt: '+(e.message||e),1)}}
async function matchScan(it){
  const words=norm((it.producent||'')+' '+(it.wijnnaam||'')).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>=4&&!['chateau','domaine','bodegas','weingut','cuvee','reserve','grand','tinto','blanc','rouge','rosso','bianco'].includes(x)).sort((x,y)=>y.length-x.length).slice(0,3);
  let c=[];for(const wd of words){try{c=c.concat(await q(sb.from('wijnen').select('wijn_id,producent,wijnnaam_cuvee,jaargang,wijnkleur,regio,land,regionale_stijl,druiven,vivino_url,vivino_gemiddelde,etiketfoto_url,flesfoto_url,bewaarzone_advies').or(`producent.ilike.%${ilk(wd)}%,wijnnaam_cuvee.ilike.%${ilk(wd)}%`).limit(40)))}catch(e){}}
  const seen=new Map();c.forEach(x=>seen.set(x.wijn_id,x));
  it.kand=[...seen.values()].map(x=>{const k=norm(naam(x));const hit=words.filter(wd=>k.includes(wd)).length;let s=hit*2;if(it.kleur&&x.wijnkleur===it.kleur)s+=1;const jm=!!(it.jaargang&&x.jaargang===+it.jaargang);if(jm)s+=3;return {x,s,jm,hit}}).filter(o=>o.hit>=1&&o.s>=3).sort((p,q2)=>q2.s-p.s||(q2.jm-p.jm));it.kand=it.kand.filter(o=>o.s>=it.kand[0].s-2).slice(0,3);
  const b=it.kand[0];
  if(b&&b.s>=5&&(b.jm||!it.jaargang||!b.x.jaargang))it.keuze='w:'+b.x.wijn_id;
  else if(b&&b.s>=4&&it.jaargang)it.keuze='j:'+b.x.wijn_id;   // zelfde wijn, andere jaargang
}

async function scanOpslaan(){const s=S.scan,btn=$('#scanGo');btn.disabled=true;btn.textContent='Opslaan…';

}
const VERSIE='2026-11-04c';
// Updatecheck: haalt de live versie op zonder cache; bij een nieuwere versie herlaadt de app zichzelf (ook vanaf het beginscherm)
async function checkUpdate(){try{const t=await (await fetch(location.pathname+'?u='+Date.now(),{cache:'no-store'})).text();
  const m=t.match(/const VERSIE='([^']+)'/);if(m&&m[1]!==VERSIE){toast('Nieuwe versie — even herladen…');setTimeout(()=>location.replace(location.pathname+'?v='+m[1]),800)}}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
checkUpdate();
start();
</script>
